<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">

<title>AI For School Growth · Live Practicals | ForraNova</title>

<!-- Google Fonts & Font Awesome -->
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
/* ===============================
   Background Animation host
================================ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #03050a;
    font-family: monospace;
}

#space-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    display: block;
}

/* ===============================
   FUTURISTIC THEME TOKENS
================================ */

body.dark {
    --bg-page: #06080f;
    --slide-bg: rgba(8, 11, 20, 0.72);
    --text-primary: #eef3ff;
    --text-secondary: #9aa8c7;
    --text-muted: #5e6a8a;
    --accent-cyan: #00d4ff;          /* Plasma Blue */
    --accent-violet: #ffc266;        /* Electric Indigo */
    --accent-emerald: #00e5a0;       /* Quantum Mint */
    --accent-amber: #ffb347;         /* Solar Flare */
    --card-bg: rgba(15, 20, 36, 0.65);
    --border-light: rgba(0, 212, 255, 0.15);
    --nav-dot-bg: rgba(154, 168, 199, 0.28);
    --nav-dot-active: #ffb347;
    --opaque: rgba(0, 212, 255, 0.04);
    --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    --shadow-sm: 0 20px 50px -16px rgba(123, 47, 252, 0.3);
    --glow-cyan: 0 0 20px rgba(0, 212, 255, 0.35);
    --glow-violet: 0 0 20px rgba(123, 47, 252, 0.4);
}

body.light {
    --bg-page: #f5f7fc;
    --slide-bg: rgba(255, 255, 255, 0.85);
    --text-primary: #0a0e1a;
    --text-secondary: #2a3350;
    --text-muted: #5a6484;
    --accent-cyan: #7b2ffc;          /* Electric Indigo in light mode */
    --accent-violet: #995c00;        /* Plasma Blue in light mode */
    --accent-emerald: #00a86b;
    --accent-amber: #d97706;
    --card-bg: rgba(255, 255, 255, 0.75);
    --border-light: rgba(123, 47, 252, 0.18);
    --nav-dot-bg: rgba(42, 51, 80, 0.2);
    --nav-dot-active: #d97706;
    --opaque: rgba(123, 47, 252, 0.04);
    --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    --shadow-sm: 0 20px 50px -16px rgba(0, 0, 0, 0.12);
    --glow-cyan: 0 0 20px rgba(123, 47, 252, 0.2);
    --glow-violet: 0 0 20px rgba(0, 212, 255, 0.2);
}

body {
    font-family: 'Inter', sans-serif;
    color: var(--text-primary);
    overflow: hidden;
    transition: var(--transition);
    height: 100vh;
    width: 100vw;
}

/* ===============================
   HEADER AND NAVIGATION
================================ */
header {
    position: fixed;
    top: 5px;
    width: 100%;
    max-height: 110px;
    z-index: 1000;
    background: rgba(5, 6, 12, 0.45);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(0, 229, 255, 0.15);
    margin-top: -20px;
}

.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    white-space: nowrap;
    padding: 5px 5%;
    color: var(--accent-cyan);
}

.slogan {
    font-size: 1.2rem;
    flex-direction: column;
    text-align: center;
    color: #00e0ff;
    padding-right: -50px;
    margin-left: -50px;
    font-family: 'Space Grotesk', sans-serif;
    letter-spacing: 0.5px;
    text-shadow: 0 0 18px rgba(0, 229, 255, 0.45);
}

.foota {
    z-index: -0.3;
    height: 55px;
    filter: drop-shadow(0 0 10px rgba(128, 255, 255, 0.6));
}

.nav-links a {
    font-size: 1.2rem;
    transition: 0.3s;
    color: #cfe9ff;
    text-decoration: none;
    letter-spacing: 0.3px;
    font-family: 'Space Grotesk', sans-serif;
    text-transform: uppercase;
}

.nav-links li {
    margin-left: 22px;
    font-weight: 600;
    position: relative;
}

.nav-links li::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: -6px;
    width: 0%;
    height: 1px;
    background: var(--accent-cyan);
    transition: width 0.25s ease;
}

.nav-links li:hover::after { width: 100%; }
.nav-links li:hover a, .nav-links a:hover { color: var(--accent-cyan); }

.nav-links {
    list-style: none;
    display: flex;
    gap: 8px;
}

.menu-toggle {
    display: none;
    cursor: pointer;
    flex-direction: column;
    gap: 5px;
}

.menu-toggle .bar {
    width: 25px;
    height: 2px;
    background-color: #00e0ff;
    transition: all 0.3s ease;
    box-shadow: 0 0 6px rgba(0, 229, 255, 0.6);
}

@media screen and (max-width: 900px) {
    .menu-toggle { display: flex; }
    .nav-links {
        display: none;
        flex-direction: column;
        width: 100%;
        position: absolute;
        top: 90px;
        left: 0;
        background: rgba(5, 6, 12, 0.97);
        text-align: center;
        padding: 10px 0;
        border-bottom: 1px solid rgba(0,229,255,0.2);
    }
    .nav-links.active, .nav-links.open { display: flex; }
    .nav-links li { margin: 10px 0; }
    .menu-toggle.active .bar {
        width: 3px;
        height: 22px;
        margin: 0 2px;
        display: inline-block;
    }
    .menu-toggle.active { flex-direction: row; gap: 4px; }
}

/* ================== Animated Logo ================== */
:root {
    --canvas-width: 150px;
    --canvas-height: 160px;
    --bg-logo-sizeW: 92px;
    --bg-logo-sizeH: 92px;
    --bg-logo-top: 14px;
    --bg-logo-left: 28px;
    --brain-size: 56px;
    --brain-top: 30px;
    --brain-left: 60px;
    --heartbeat-speed: 2s;
    --text-width: 158px;
    --text-bottom: 28px;
    --text-down: 18px;
    --text-left: -10px;
    --spin-speed: 6s;
}

.logo-component {
    position: relative;
    width: var(--canvas-width);
    height: var(--canvas-height);
    margin-left: 20px;
    overflow: hidden;
    perspective: 1000px;
    background: transparent;
    float: left;
}
.logo-layer {
    position: absolute;
    background-repeat: no-repeat;
    background-size: contain;
    background-position: center;
}
.layer-bg-logo {
    width: var(--bg-logo-sizeW);
    height: var(--bg-logo-sizeH);
    top: var(--bg-logo-top);
    left: var(--bg-logo-left);
    z-index: 1000;
    border-radius: 50%;
}
.layer-brain {
    width: var(--brain-size);
    height: var(--brain-size);
    top: var(--brain-top);
    left: var(--brain-left);
    z-index: 2000;
    animation: heartbeat var(--heartbeat-speed) ease-in-out infinite;
    transform-origin: center center;
    filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.65));
}
.layer-text {
    width: var(--text-width);
    height: calc(var(--text-width) * 0.25);
    bottom: var(--text-bottom);
    left: var(--text-left);
    z-index: 3000;
    transform-style: preserve-3d;
    animation: spin3D var(--spin-speed) linear infinite;
}

@keyframes heartbeat {
    0% { transform: scale(1); }
    25% { transform: scale(1.05); }
    45% { transform: scale(1.02); }
    65% { transform: scale(1.07); }
    100% { transform: scale(1); }
}
@keyframes spin3D {
    0% { transform: rotateY(0deg); }
    100% { transform: rotateY(360deg); }
}
@media (max-width: 600px) {
    .logo-component { overflow: visible; margin-left: 20px; }
    .layer-text { bottom: var(--text-down); }
}

/* MAIN APP LAYOUT */
.app-container {
    display: flex;
    top: 100px;
    height: 90%;
    width: 100%;
    position: relative;
    left: -15px;
}

/* LEFT NAVIGATION — vertical dot rail */
.nav-dots-bar {
    position: fixed;
    transform: rotate(90deg);
    left: -200px;
    top: 50%;
    background: rgba(8, 10, 20, 0.65);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 60px;
    padding: 16px 12px;
    display: flex;
    flex-direction: row;
    gap: 16px;
    z-index: 1000;
    box-shadow: 0 8px 30px rgba(0, 229, 255, 0.12);
    border: 1px solid rgba(0, 229, 255, 0.22);
    transition: var(--transition);
}
.nav-dot {
    width: 18px;
    height: 18px;
    background: var(--nav-dot-bg);
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.2s ease;
    opacity: 0.6;
    position: relative;
}
.nav-dot.active {
    background: var(--nav-dot-active);
    transform: scale(1.55);
    opacity: 1;
    box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.22), 0 0 14px rgba(0, 229, 255, 0.65);
}
.nav-dot:hover {
    opacity: 1;
    transform: scale(1.25);
    background: var(--accent-cyan);
}

/* SLIDES CONTAINER */
.slides-container {
    flex: 1;
    margin-left: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
    position: relative;
    touch-action: pan-y;
}
.slide-view {
    width: 100%;
    max-width: 1180px;
    height: 80vh;
    min-height: 570px;
    background: var(--slide-bg);
    box-shadow: var(--shadow-sm);
    overflow-y: auto;
    padding: 44px 52px;
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease;
    scrollbar-width: thin;
    border-radius: 18px;
    margin-top: -40px;
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border: 1px solid var(--border-light);
    position: relative;
}
.slide-view::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent-cyan), var(--accent-violet), transparent);
    opacity: 0.8;
}
@keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(24px) scale(0.985); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}
.slide-view.entering { animation: fadeSlideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1); }

.slide-view.swipe-out-left  { transform: translateX(-60px); opacity: 0; }
.slide-view.swipe-out-right { transform: translateX(60px); opacity: 0; }
.slide-view.swipe-out-down  { transform: translateY(60px) scale(0.96); opacity: 0; }

.slide-view::-webkit-scrollbar { width: 6px; }
.slide-view::-webkit-scrollbar-track { background: transparent; }
.slide-view::-webkit-scrollbar-thumb { background: var(--accent-cyan); border-radius: 8px; }

.dark-mode-toggle {
    position: fixed;
    top: 105px;
    right: 12px;
    z-index: 1100;
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    border-radius: 60px;
    width: 46px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(0, 229, 255, 0.15);
    transition: 0.2s;
    border: 1px solid var(--border-light);
}
.fa-moon, .fa-sun { font-size: 1.25rem; color: var(--accent-cyan); }

/* gesture hint indicator */
.gesture-hint {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1050;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    background: rgba(8, 10, 20, 0.85);
    border: 1px solid var(--border-light);
    border-radius: 40px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.4px;
    backdrop-filter: blur(14px);
    opacity: 0.85;
    pointer-events: none;
    transition: opacity 0.4s ease;
}
.gesture-hint i { color: var(--accent-cyan); }
.gesture-hint.fade { opacity: 0; }

/* progress rail (top thin bar) */
.progress-rail {
    position: fixed;
    top: 0; left: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent-cyan), var(--accent-violet));
    z-index: 1200;
    transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: 0 0 10px rgba(0, 229, 255, 0.7);
}

/* slide counter */
.slide-counter {
    position: fixed;
    bottom: 22px;
    right: 24px;
    z-index: 1050;
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    letter-spacing: 1px;
    color: var(--text-muted);
    background: rgba(8, 10, 20, 0.55);
    border: 1px solid var(--border-light);
    padding: 6px 12px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
}
.slide-counter span { color: var(--accent-cyan); font-weight: 600; }

/* prev/next arrow controls */
.slide-arrow {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    z-index: 1050;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(8, 10, 20, 0.55);
    border: 1px solid var(--border-light);
    color: var(--accent-cyan);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: 0.2s;
}
.slide-arrow:hover { background: rgba(0, 229, 255, 0.15); transform: translateY(-50%) scale(1.08); }
.slide-arrow.prev { right: 84px; }
.slide-arrow.next { right: 24px; }
.slide-arrow:disabled, .slide-arrow.disabled { opacity: 0.25; pointer-events: none; }

@media (max-width: 1400px) {
    .nav-dots-bar { left: -200px; padding: 12px 8px; gap: 12px; }
}
@media (max-width: 860px) {
    .nav-dots-bar { left: -230px; padding: 12px 8px; gap: 12px; }
    .slides-container { margin-left: 70px; padding: 16px; }
    .slide-view { padding: 30px 22px; height: 82vh; }
    .pillar-grid, .tool-grid { grid-template-columns: 1fr; }
    .slide-arrow { display: flex; }
}
@media (max-width: 580px) {
    .nav-dots-bar { left: -230px; gap: 10px; padding: 12px 6px; }
    .slide-view { padding: 22px 16px; }
    h2 { font-size: 1.9rem; }
}

/* ===============================
   TYPOGRAPHY & CONTENT SYSTEM
================================ */
h1, h2, h3, .display-head {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    letter-spacing: -0.01em;
}
.eyebrowHead {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.9rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent-cyan);
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
}
.eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.2rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent-cyan);
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
}
.eyebrow::before {
    content: '';
    width: 22px;
    height: 1px;
    background: var(--accent-cyan);
}
.cyan-accent { color: var(--accent-cyan); }
.violet-accent { color: var(--accent-violet); }
.emerald-accent { color: var(--accent-emerald); }
.amber-accent { color: var(--accent-amber); }
.gradient-text {
    background: linear-gradient(120deg, var(--accent-cyan), var(--accent-violet));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}
h1 { font-size: 2.6rem; line-height: 1.12; margin-bottom: 14px; }
h2 { font-size: 2.1rem; line-height: 1.18; margin-bottom: 10px; }
h3 { font-size: 1.25rem; margin-bottom: 8px; }
p { color: var(--text-secondary); line-height: 1.65; }
.lede { font-size: 1.1rem; color: var(--text-secondary);}
.slide-view a { color: var(--accent-cyan); text-decoration: none; font-weight: 600; }
.slide-view a:hover { text-decoration: underline; }

.badge {
    display: inline-block;
    background: linear-gradient(120deg, var(--accent-cyan), var(--accent-violet));
    color: #041014;
    font-size: 0.95rem;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 30px;
    letter-spacing: 0.5px;
    margin-bottom: 16px;
    font-family: 'JetBrains Mono', monospace;
}

hr { 
    border: none; 
    margin: 24px 0; 
    border-top: 1px solid var(--border-light);
}

/* GRID SYSTEMS */
.pillar-grid, .tool-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin: 28px 0;
}
.pillar-grid-a {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    gap: 20px;
    margin: 28px 0;
}
.pillar-card, .tool-card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 22px 20px;
    transition: transform 0.25s ease, border-color 0.25s ease;
    border: 1px solid var(--border-light);
    position: relative;
    overflow: hidden;
}
.pillar-card::before, .tool-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
    background: linear-gradient(180deg, var(--accent-cyan), var(--accent-violet));
}
.pillar-card:hover, .tool-card:hover {
    transform: translateY(-4px);
    border-color: rgba(0, 229, 255, 0.45);
}
.pillar-card i, .tool-card i { font-size: 2.3rem; color: var(--accent-cyan); margin-bottom: 14px; display: block; }
.pillar-card h3, .tool-card h3 { font-size: 1.59rem; margin-bottom: 10px; }
.tool-card .tier {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 19px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 12px;
    margin-bottom: 10px;
}
.tier.free { background: rgba(0, 229, 255, 0.15); color: var(--accent-cyan); }
.tier.paid { background: rgba(139, 92, 246, 0.18); color: var(--accent-violet); }

.stat-number {
    font-size: 2.2rem;
    font-weight: 800;
    font-family: 'Space Grotesk', sans-serif;
    background: linear-gradient(120deg, var(--accent-cyan), var(--accent-violet));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}
.stat-row { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 32px; margin: 24px 0; }
.stat-item .stat-label { font-size: 1.3rem; color: var(--text-muted); margin-top: 4px; max-width: 300px; }

/* STEP WORKFLOW */
.step-list { counter-reset: step; margin: 26px 0; display: flex; flex-direction: column; gap: 14px; }
.step-item {
    display: flex;
    gap: 16px;
    align-items: flex-start;
    background: var(--card-bg);
    border: 1px solid var(--border-light);
    border-radius: 14px;
    padding: 16px 18px;
}
.step-num {
    counter-increment: step;
    flex-shrink: 0;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet));
    color: #041014;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
}
.step-num::before { content: counter(step); }
.step-text h4 { font-size: 29rem; margin-bottom: 4px; color: var(--text-primary); }
.step-text p { font-size: 0.92rem; margin: 0; }

/* IMAGE / MEDIA */
.image-illustration {
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 12px 30px -12px rgba(0,0,0,0.5);
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border-light);
    max-width:500px;
    margin:0 auto 28px;
}
.image-illustration img { width: 100%; height: auto; display: block; object-fit: cover; max-height: 300px; }

.hero { text-align: center; }
.hero p { text-align: center; }
.footer-note { font-size: 0.75rem; text-align: center; margin-top: 32px; color: var(--text-muted); }

table { border-collapse: collapse; width: 100%; margin: 16px 0; }
th { border-bottom: 2px solid var(--border-light); text-align: left; padding: 10px; color: var(--accent-cyan); font-family: 'JetBrains Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
td { border-bottom: 1px solid var(--border-light); text-align: left; padding: 10px; color: var(--text-secondary); }
tr:nth-child(even) { background-color: var(--opaque); }

/* ===============================
   PRACTICAL CARD COMPONENTS
================================ */
.practical-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    margin: 24px 0;
}

.practical-card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 24px 22px;
    border: 1px solid var(--border-light);
    transition: transform 0.25s ease, border-color 0.25s ease;
    position: relative;
    overflow: hidden;
}
.practical-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;

];

function renderChecklist(container) {
    if (!container) return;
    container.innerHTML = '';
    checklistItems.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'check-item';
        div.innerHTML = `
            <input type="checkbox" id="chk_${idx}" data-index="${idx}">
            <label for="chk_${idx}" style="cursor:pointer;">
                <strong>${item.label}</strong>
                <div class="desc">${item.desc}</div>
            </label>
        `;
        container.appendChild(div);
    });
}

function getInterpretation(percent) {
    if (percent >= 91) return 'KUDOS! You are ready for a controlled Copilot.';
    if (percent >= 81) return 'Strong foundation — refine a few areas before pilot.';
    if (percent >= 71) return 'Good progress; address remaining gaps for smoother adoption.';
    if (percent >= 61) return 'Moderate readiness — focus on key missing pillars.';
    if (percent >= 51) return 'Several gaps identified — prioritise foundational elements.';
    if (percent >= 41) return 'Address key gaps first before considering AI.';
    if (percent >= 36) return 'Strengthen foundations before expanding AI use.';
    return 'Preparation is the key. Start small and raise.';
}

function updateCounter() {
    const container = document.getElementById('checklistContainer');
    if (!container) return;

    const checkboxes = container.querySelectorAll('input[type="checkbox"]');
    const total = checkboxes.length;
    let checked = 0;
    checkboxes.forEach(cb => { if (cb.checked) checked++; });

    const fraction = total > 0 ? (checked / total) : 0;
    const percent = Math.round(fraction * 100);

    const surveyEl = document.getElementById('survey');
    const percentEl = document.getElementById('percentDisplay');
    const feedbackArea = document.getElementById('feedbackArea');

    if (surveyEl) surveyEl.textContent = `${checked} / ${total}`;
    if (percentEl) percentEl.textContent = percent;

    if (feedbackArea) {
        const customMsg = getInterpretation(percent);
        feedbackArea.innerHTML = `<p style="margin:0; color:var(--text-secondary); line-height:1.6;"><strong>Interpretation:</strong> → <span style="color:var(--accent-cyan); font-weight:500;">${customMsg}</span></p>`;
    }
}

function setupChecklistListener(container) {
    if (!container) return;
    container.removeEventListener('change', handleChecklistChange);
    container.addEventListener('change', function(e) {
        if (e.target && e.target.matches('input[type="checkbox"]')) {
            updateCounter();
        }
    });
}

function handleChecklistChange(e) {
    if (e.target && e.target.matches('input[type="checkbox"]')) {
        updateCounter();
    }
}

/* ===============================
   SLIDE ENGINE + NAV DOTS
================================ */
let currentSlideIndex = 0;
let isAnimating = false;
const slideContainer = document.getElementById('slidesContainer');
const navDotsBar = document.getElementById('navDotsBar');
const progressRail = document.getElementById('progressRail');
const counterCurrent = document.getElementById('counterCurrent');
const counterTotal = document.getElementById('counterTotal');
const prevArrow = document.getElementById('prevArrow');
const nextArrow = document.getElementById('nextArrow');
const gestureHint = document.getElementById('gestureHint');

counterTotal.textContent = slidesData.length;

function renderActiveSlide(direction) {
    if (!slideContainer) return;
    const slide = slidesData[currentSlideIndex];
    const slideHtml = `<div class="slide-view entering" id="activeSlideView">${slide.html}</div>`;
    slideContainer.innerHTML = slideHtml;
    updateActiveDot();
    updateProgress();
    updateArrows();
    
    // Re-init checklist if on slide with checklist
    const container = document.getElementById('checklistContainer');
    if (container) {
        renderChecklist(container);
        setupChecklistListener(container);
        updateCounter();
    }
}

function updateActiveDot() {
    const dots = document.querySelectorAll('.nav-dot');
    dots.forEach((dot, idx) => {
        dot.classList.toggle('active', idx === currentSlideIndex);
    });
}

function updateProgress() {
    const pct = ((currentSlideIndex + 1) / slidesData.length) * 100;
    progressRail.style.width = pct + '%';
    counterCurrent.textContent = currentSlideIndex + 1;
}

function updateArrows() {
    prevArrow.classList.toggle('disabled', currentSlideIndex === 0);
    nextArrow.classList.toggle('disabled', currentSlideIndex === slidesData.length - 1);
}

function createNavigationDots() {
    navDotsBar.innerHTML = '';
    slidesData.forEach((_, idx) => {
        const dot = document.createElement('div');
        dot.classList.add('nav-dot');
        if (idx === currentSlideIndex) dot.classList.add('active');
        dot.addEventListener('click', () => {
            if (idx === currentSlideIndex) return;
            currentSlideIndex = idx;
            renderActiveSlide();
        });
        navDotsBar.appendChild(dot);
    });
}

function goToSlide(newIndex, exitClass) {
    if (isAnimating) return;
    if (newIndex < 0 || newIndex > slidesData.length - 1) return;
    const activeView = document.getElementById('activeSlideView');
    isAnimating = true;
    if (activeView) {
        activeView.classList.add(exitClass);
        setTimeout(() => {
            currentSlideIndex = newIndex;
            renderActiveSlide();
            isAnimating = false;
        }, 220);
    } else {
        currentSlideIndex = newIndex;
        renderActiveSlide();
        isAnimating = false;
    }
}

function nextSlide() { goToSlide(currentSlideIndex + 1, 'swipe-out-left'); }
function prevSlide() { goToSlide(currentSlideIndex - 1, 'swipe-out-right'); }
function jumpToClose() { goToSlide(slidesData.length - 1, 'swipe-out-down'); }

prevArrow.addEventListener('click', prevSlide);
nextArrow.addEventListener('click', nextSlide);

/* dark / light mode toggle */
const darkToggle = document.getElementById('darkModeToggle');
function initTheme() {
    const saved = localStorage.getItem('schoolTheme') || 'dark';
    document.body.classList.toggle('light', saved === 'light');
    document.body.classList.toggle('dark', saved !== 'light');
    darkToggle.innerHTML = saved === 'light' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
}
darkToggle.addEventListener('click', () => {
    const goingLight = !document.body.classList.contains('light');
    document.body.classList.toggle('light', goingLight);
    document.body.classList.toggle('dark', !goingLight);
    localStorage.setItem('schoolTheme', goingLight ? 'light' : 'dark');
    darkToggle.innerHTML = goingLight ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
});

/* keyboard navigation */
window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') prevSlide();
    else if (e.key === 'ArrowUp') prevSlide();
    else if (e.key === 'ArrowRight') nextSlide();
    else if (e.key === 'ArrowDown') nextSlide();
    else if (e.key === 'Escape') jumpToClose();
});

/* ===============================
   GESTURE / SWIPE NAVIGATION
================================ */
(function initGestures() {
    const target = document.getElementById('slidesContainer');
    let startX = 0, startY = 0, startTime = 0;
    let tracking = false;

    const THRESH_X = 60;
    const THRESH_Y_SOFT = 70;
    const THRESH_Y_FORCE = 140;
    const MAX_TIME = 900;

    function pointerDown(x, y) {
        startX = x; startY = y; startTime = Date.now();
        tracking = true;
    }
    function pointerUp(x, y) {
        if (!tracking) return;
        tracking = false;
        const dx = x - startX;
        const dy = y - startY;
        const dt = Date.now() - startTime;
        if (dt > MAX_TIME) return;

        const absX = Math.abs(dx);
        const absY = Math.abs(dy);

        if (dy > THRESH_Y_FORCE && absY > absX) {
            jumpToClose();
            hideHint();
            return;
        }
        if (absX > THRESH_X && absX > absY) {
            if (dx < 0) nextSlide(); else prevSlide();
            hideHint();
            return;
        }
        if (dy < -THRESH_Y_SOFT && absY > absX) {
            nextSlide();
            hideHint();
        }
    }

    target.addEventListener('touchstart', (e) => {
        const t = e.changedTouches[0];
        pointerDown(t.clientX, t.clientY);
    }, { passive: true });

    target.addEventListener('touchend', (e) => {
        const t = e.changedTouches[0];
        pointerUp(t.clientX, t.clientY);
    }, { passive: true });

    let mouseDown = false;
    target.addEventListener('mousedown', (e) => {
        mouseDown = true;
        pointerDown(e.clientX, e.clientY);
    });
    window.addEventListener('mouseup', (e) => {
        if (!mouseDown) return;
        mouseDown = false;
        pointerUp(e.clientX, e.clientY);
    });

    function hideHint() {
        if (gestureHint) gestureHint.classList.add('fade');
    }
    setTimeout(hideHint, 5000);
})();

/* responsive init */
function init() {
    createNavigationDots();
    renderActiveSlide();
    initTheme();
}
init();
</script>

if (hamburger && mainNav) {

    '⟡', '⟢', '⧊', '⧋', '⨀', '⨂', '⨁', '⌀', '⌘', '⌬',

const CONFIG = {
    starBaseCount: 240,
    starMinRadius: 0.2,
    starMaxRadius: 2.9,
    starBlinkSpeedMin: 0.3,
    starBlinkSpeedMax: 2.8,
    starBaseAlphaMin: 0.25,
    starBaseAlphaMax: 0.75,
    shootingStarMaxActive: 1,
    shootingStarSpawnIntervalMin: 250,
    shootingStarSpawnIntervalMax: 1250,
    shootingStarSpeedMin: 100,
    shootingStarSpeedMax: 1100,
    shootingStarTrailLength: 45,
    shootingStarHeadRadius: 5.2,
    shootingStarGlowRadius: 20,
    shootingStarLifetimeMin: 1400,
    shootingStarLifetimeMax: 2800,
    charRainSpawnIntervalPx: 6,
    charRainFontSizeMin: 10,
    charRainFontSizeMax: 30,
    charRainGravity: 140,
    charRainLifetimeMin: 900,
    charRainLifetimeMax: 2200,
    charRainMaxTotal: 220,
    charRainFriction: 0.92,
    planetCount: 9,
    nebulaCount: 4,
    orbitalPathCount: 5,
    constellationNodeCount: 14,
};

const rand = (min, max) => Math.random() * (max - min) + min;
const randInt = (min, max) => Math.floor(rand(min, max + 1));
const pickRandom = (arr) => arr[randInt(0, arr.length - 1)];
const clamp = (val, min, max) => Math.max(min, Math.min(max, val));

class Star {
    constructor(canvasWidth, canvasHeight) {
        this.x = Math.random() * canvasWidth;
        this.y = Math.random() * canvasHeight;
        this.radius = rand(CONFIG.starMinRadius, CONFIG.starMaxRadius);
        this.depth = clamp(this.radius / CONFIG.starMaxRadius, 0.1, 1.0);
        this.baseAlpha = rand(CONFIG.starBaseAlphaMin, CONFIG.starBaseAlphaMax);
        this.maxAlpha = Math.min(1.0, this.baseAlpha + 0.35);
        this.blinkSpeed = rand(CONFIG.starBlinkSpeedMin, CONFIG.starBlinkSpeedMax);
        this.blinkOffset = Math.random() * Math.PI * 2;
        this.currentAlpha = this.baseAlpha;
        const temp = rand(0, 1);
        if (temp < 0.12) {
            this.color = { r: 180, g: 200, b: 255 };
        } else if (temp < 0.22) {
            this.color = { r: 255, g: 240, b: 210 };
        } else if (temp < 0.28) {
            this.color = { r: 255, g: 200, b: 180 };
        } else {
            this.color = { r: 235, g: 235, b: 250 };
        }
    }

    update(time) {
        const wave = Math.sin(time * this.blinkSpeed + this.blinkOffset) * 0.5 + 0.5;
        this.currentAlpha = this.baseAlpha + (this.maxAlpha - this.baseAlpha) * wave;
        const microWave = Math.sin(time * 5.3 + this.blinkOffset * 1.7) * 0.5 + 0.5;
        this.currentAlpha += microWave * 0.08;
        this.currentAlpha = clamp(this.currentAlpha, this.baseAlpha * 0.7, this.maxAlpha);
    }

    draw(ctx) {
        const alpha = this.currentAlpha;
        if (alpha < 0.03) return;
        const { r, g, b } = this.color;
        ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        if (this.radius > 1.2 && alpha > 0.55) {
            const glowAlpha = alpha * 0.18;
            const glowRadius = this.radius * 3.5;
            const gradient = ctx.createRadialGradient(this.x, this.y, this.radius * 0.5, this.x, this.y, glowRadius);
            gradient.addColorStop(0, `rgba(${r},${g},${b},${glowAlpha})`);
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(this.x, this.y, glowRadius, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

class CharacterRainParticle {
    constructor(x, y, shootingStarVx, shootingStarVy) {
        this.x = x;
        this.y = y;
        this.character = pickRandom(MULTILINGUAL_CHARS);
        this.fontSize = rand(CONFIG.charRainFontSizeMin, CONFIG.charRainFontSizeMax);
        const inheritedVx = shootingStarVx * rand(0.25, 0.7);
        const inheritedVy = shootingStarVy * rand(0.25, 0.7);
        this.vx = inheritedVx + rand(-60, 60);
        this.vy = inheritedVy + rand(-30, 20);
        this.gravity = CONFIG.charRainGravity;
        this.friction = CONFIG.charRainFriction;
        this.lifetime = rand(CONFIG.charRainLifetimeMin, CONFIG.charRainLifetimeMax);
        this.maxLifetime = this.lifetime;
        this.opacity = rand(0.75, 1.0);
        const colorRoll = Math.random();
        if (colorRoll < 0.45) {
            this.color = { r: 80, g: 255, b: 180 };
        } else if (colorRoll < 0.75) {
            this.color = { r: 100, g: 240, b: 255 };
        } else if (colorRoll < 0.9) {
            this.color = { r: 180, g: 255, b: 220 };
        } else {
            this.color = { r: 220, g: 240, b: 255 };
        }
    }

    update(dt) {
        this.vy += this.gravity * dt;
        this.vx *= this.friction;
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.lifetime -= dt * 1000;
        const lifeRatio = clamp(this.lifetime / this.maxLifetime, 0, 1);
        this.opacity = lifeRatio * 0.9;
    }

    get isDead() {
        return this.lifetime <= 0 || this.opacity < 0.02;
    }

    draw(ctx) {
        if (this.opacity < 0.03) return;
        const { r, g, b } = this.color;
        ctx.fillStyle = `rgba(${r},${g},${b},${this.opacity})`;
        ctx.font = `${this.fontSize}px "Courier New", "MS Gothic", "Noto Sans", monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        if (this.opacity > 0.5) {
            ctx.shadowColor = `rgba(${r},${g},${b},${this.opacity * 0.5})`;
            ctx.shadowBlur = this.fontSize * 0.6;
        } else {
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
        }
        ctx.fillText(this.character, this.x, this.y);
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
    }
}

class ShootingStar {
    constructor(canvasWidth, canvasHeight) {
        this.canvasWidth = canvasWidth;
        this.canvasHeight = canvasHeight;
        this.active = true;
        this.lifetime = rand(CONFIG.shootingStarLifetimeMin, CONFIG.shootingStarLifetimeMax);
        this.maxLifetime = this.lifetime;
        this.speed = rand(CONFIG.shootingStarSpeedMin, CONFIG.shootingStarSpeedMax);
        this.trail = [];
        this.maxTrailLength = CONFIG.shootingStarTrailLength;
        this.distanceSinceLastSpawn = 0;
        this.spawnInterval = CONFIG.charRainSpawnIntervalPx;
        this.spawnedParticles = [];
        this._initializeTrajectory();
    }

    _initializeTrajectory() {
        const w = this.canvasWidth;
        const h = this.canvasHeight;
        const edge = randInt(0, 3);
        let startX, startY, angle;

        switch (edge) {
            case 0:
                startX = rand(0, w);
                startY = -20;
                angle = rand(Math.PI * 0.35, Math.PI * 0.65);
                break;
            case 1:
                startX = w + 20;
                startY = rand(h * 0.1, h * 0.7);
                angle = rand(Math.PI * 0.85, Math.PI * 1.15);
                break;
            case 2:
                startX = rand(0, w);
                startY = h + 20;
                angle = rand(Math.PI * 1.35, Math.PI * 1.65);
                break;
            case 3:
            default:
                startX = -20;
                startY = rand(h * 0.15, h * 0.75);
                angle = rand(-Math.PI * 0.15, Math.PI * 0.15);
                break;
        }

        angle += rand(-0.25, 0.25);
        this.x = startX;
        this.y = startY;
        this.vx = Math.cos(angle) * this.speed;
        this.vy = Math.sin(angle) * this.speed;
        this.angle = angle;
        this.trail.push({ x: this.x, y: this.y, age: 0 });
    }

    update(dt) {
        if (!this.active) return;
        this.lifetime -= dt * 1000;
        this.x += this.vx * dt;
        this.y += this.vy * dt;

        for (const point of this.trail) {
            point.age += dt * 1000;
        }
        this.trail.push({ x: this.x, y: this.y, age: 0 });
        while (this.trail.length > this.maxTrailLength) {
            this.trail.shift();
        }
        const maxTrailAge = 600;
        this.trail = this.trail.filter(p => p.age < maxTrailAge);

        if (this.trail.length >= 2) {
            const last = this.trail[this.trail.length - 1];
            const prev = this.trail[this.trail.length - 2];
            const dx = last.x - prev.x;
            const dy = last.y - prev.y;
            this.distanceSinceLastSpawn += Math.sqrt(dx * dx + dy * dy);
        }

        while (this.distanceSinceLastSpawn >= this.spawnInterval) {
            this.distanceSinceLastSpawn -= this.spawnInterval;
            const particle = new CharacterRainParticle(this.x, this.y, this.vx, this.vy);
            this.spawnedParticles.push(particle);
        }

        const buffer = 150;
        if (
            this.x < -buffer ||
            this.x > this.canvasWidth + buffer ||
            this.y < -buffer ||
            this.y > this.canvasHeight + buffer
        ) {
            this.active = false;
        }
        if (this.lifetime <= 0) {
            this.active = false;
        }
    }

    draw(ctx) {
        if (!this.active || this.trail.length < 2) return;
        const trailLen = this.trail.length;
        for (let i = 1; i < trailLen; i++) {
            const ratio = i / trailLen;
            const alpha = ratio * 0.75;
            const width = ratio * 2.8;
            ctx.strokeStyle = `rgba(180,210,255,${alpha})`;
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(this.trail[i - 1].x, this.trail[i - 1].y);
            ctx.lineTo(this.trail[i].x, this.trail[i].y);
            ctx.stroke();
        }

        const headAlpha = clamp(this.lifetime / this.maxLifetime, 0.3, 1.0);
        const glowGradient = ctx.createRadialGradient(
            this.x, this.y, CONFIG.shootingStarHeadRadius * 0.3,
            this.x, this.y, CONFIG.shootingStarGlowRadius
        );
        glowGradient.addColorStop(0, `rgba(220,240,255,${headAlpha * 0.85})`);
        glowGradient.addColorStop(0.3, `rgba(180,220,255,${headAlpha * 0.5})`);
        glowGradient.addColorStop(0.7, `rgba(100,160,255,${headAlpha * 0.15})`);
        glowGradient.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = glowGradient;
        ctx.beginPath();
        ctx.arc(this.x, this.y, CONFIG.shootingStarGlowRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = `rgba(255,255,255,${headAlpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, CONFIG.shootingStarHeadRadius, 0, Math.PI * 2);
        ctx.fill();
    }
}

class Planet {
    constructor(canvasWidth, canvasHeight, index) {
        this.canvasWidth = canvasWidth;
        this.canvasHeight = canvasHeight;
        this.index = index;
        const margin = 100;
        this.x = rand(margin, canvasWidth - margin);
        this.y = rand(margin, canvasHeight - margin);
        this.radius = rand(18, 55);
        this.depth = rand(0.3, 0.9);
        this.orbitCenterX = this.x;
        this.orbitCenterY = this.y;
        this.orbitRadiusX = rand(15, 80);
        this.orbitRadiusY = rand(10, 50);
        this.orbitSpeed = rand(0.015, 0.06);
        this.orbitAngle = rand(0, Math.PI * 2);
        this.orbitTilt = rand(0, Math.PI);
        this.baseColor = this._generateColor();
        this.hasRings = index === 1 || (Math.random() < 0.3 && index > 0);
        this.ringTilt = rand(0.4, 0.9);
        this.ringColor = this._lightenColor(this.baseColor, 0.5);
        this.atmosphereColor = this._lightenColor(this.baseColor, 0.7);
        this.bandCount = randInt(3, 7);
        this.bandOffsets = [];
        for (let i = 0; i < this.bandCount; i++) {
            this.bandOffsets.push(rand(-0.35, 0.35));
        }
    }

    _generateColor() {
        const palettes = [
            { r: 180, g: 140, b: 100 },
            { r: 100, g: 130, b: 200 },
            { r: 200, g: 170, b: 120 },
            { r: 140, g: 100, b: 180 },
            { r: 80, g: 160, b: 140 },
            { r: 210, g: 120, b: 100 },
            { r: 120, g: 150, b: 190 },
        ];
        const base = palettes[randInt(0, palettes.length - 1)];
        return {
            r: clamp(base.r + randInt(-20, 20), 40, 230),
            g: clamp(base.g + randInt(-20, 20), 40, 230),
            b: clamp(base.b + randInt(-20, 20), 40, 230),
        };
    }

    _lightenColor(color, factor) {
        return {
            r: clamp(Math.round(color.r + (255 - color.r) * factor), 0, 255),
            g: clamp(Math.round(color.g + (255 - color.g) * factor), 0, 255),
            b: clamp(Math.round(color.b + (255 - color.b) * factor), 0, 255),
        };
    }

    update(dt) {
        this.orbitAngle += this.orbitSpeed * dt;
        this.x = this.orbitCenterX + Math.cos(this.orbitAngle) * this.orbitRadiusX;
        this.y = this.orbitCenterY + Math.sin(this.orbitAngle) * this.orbitRadiusY * Math.cos(this.orbitTilt);
        const margin = 60;
        this.x = clamp(this.x, margin, this.canvasWidth - margin);
        this.y = clamp(this.y, margin, this.canvasHeight - margin);
    }

    draw(ctx) {
        const { r, g, b } = this.baseColor;
        const radius = this.radius;

        const atmoGradient = ctx.createRadialGradient(this.x, this.y, radius * 0.85, this.x, this.y, radius * 1.5);
        const ar = this.atmosphereColor.r;
        const ag = this.atmosphereColor.g;
        const ab = this.atmosphereColor.b;
        atmoGradient.addColorStop(0, `rgba(${ar},${ag},${ab},0.35)`);
        atmoGradient.addColorStop(0.5, `rgba(${ar},${ag},${ab},0.12)`);
        atmoGradient.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = atmoGradient;
        ctx.beginPath();
        ctx.arc(this.x, this.y, radius * 1.5, 0, Math.PI * 2);
        ctx.fill();

        const bodyGradient = ctx.createRadialGradient(
            this.x - radius * 0.3, this.y - radius * 0.35, radius * 0.1,
            this.x, this.y, radius
        );
        bodyGradient.addColorStop(0, `rgba(${clamp(r + 60, 0, 255)},${clamp(g + 60, 0, 255)},${clamp(b + 60, 0, 255)},1)`);
        bodyGradient.addColorStop(0.5, `rgba(${r},${g},${b},1)`);
        bodyGradient.addColorStop(1, `rgba(${clamp(r - 50, 0, 255)},${clamp(g - 50, 0, 255)},${clamp(b - 50, 0, 255)},1)`);
        ctx.fillStyle = bodyGradient;
        ctx.beginPath();
        ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
        ctx.fill();

        for (let i = 0; i < this.bandCount; i++) {
            const bandY = this.y - radius * 0.7 + (radius * 1.4 / (this.bandCount + 1)) * (i + 1);
            const bandWidth = radius * 1.6 * (0.5 + Math.abs(this.bandOffsets[i]) * 0.5);
            const distFromCenter = Math.abs(bandY - this.y) / radius;
            if (distFromCenter < 0.85) {
                const bandAlpha = 0.08 + Math.abs(this.bandOffsets[i]) * 0.15;
                const bandGradient = ctx.createLinearGradient(
                    this.x - bandWidth, bandY - radius * 0.08,
                    this.x + bandWidth, bandY + radius * 0.08
                );
                bandGradient.addColorStop(0, `rgba(0,0,0,0)`);
                bandGradient.addColorStop(0.3, `rgba(0,0,0,${bandAlpha})`);
                bandGradient.addColorStop(0.5, `rgba(255,255,255,${bandAlpha * 0.4})`);
                bandGradient.addColorStop(0.7, `rgba(0,0,0,${bandAlpha})`);
                bandGradient.addColorStop(1, `rgba(0,0,0,0)`);
                ctx.fillStyle = bandGradient;
                ctx.beginPath();
                ctx.ellipse(this.x, bandY, bandWidth, radius * 0.12, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        if (this.hasRings) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.ringTilt);
            const ringGradient = ctx.createLinearGradient(0, -radius * 0.25, 0, radius * 0.25);
            const rr = this.ringColor.r;
            const rg = this.ringColor.g;
            const rb = this.ringColor.b;
            ringGradient.addColorStop(0, `rgba(${rr},${rg},${rb},0.0)`);
            ringGradient.addColorStop(0.3, `rgba(${rr},${rg},${rb},0.55)`);
            ringGradient.addColorStop(0.45, `rgba(${rr},${rg},${rb},0.7)`);
            ringGradient.addColorStop(0.5, `rgba(255,255,255,0.3)`);
            ringGradient.addColorStop(0.55, `rgba(${rr},${rg},${rb},0.7)`);
            ringGradient.addColorStop(0.7, `rgba(${rr},${rg},${rb},0.55)`);
            ringGradient.addColorStop(1, `rgba(${rr},${rg},${rb},0.0)`);
            ctx.fillStyle = ringGradient;
            ctx.beginPath();
            ctx.ellipse(0, 0, radius * 1.6, radius * 0.32, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.beginPath();
            ctx.ellipse(0, 0, radius * 1.15, radius * 0.14, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        const specGradient = ctx.createRadialGradient(
            this.x - radius * 0.25, this.y - radius * 0.3, radius * 0.05,
            this.x, this.y, radius
        );
        specGradient.addColorStop(0, 'rgba(255,255,255,0.5)');
        specGradient.addColorStop(0.25, 'rgba(255,255,255,0.15)');
        specGradient.addColorStop(0.6, 'rgba(0,0,0,0)');
        specGradient.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = specGradient;
        ctx.beginPath();
        ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
        ctx.fill();
    }
}

class NebulaCloud {
    constructor(canvasWidth, canvasHeight) {
        this.x = rand(-canvasWidth * 0.2, canvasWidth * 1.2);
        this.y = rand(-canvasHeight * 0.2, canvasHeight * 1.2);
        this.radiusX = rand(canvasWidth * 0.25, canvasWidth * 0.7);
        this.radiusY = rand(canvasHeight * 0.2, canvasHeight * 0.55);
        this.rotation = rand(0, Math.PI);
        const palettes = [
            { r: 40, g: 20, b: 80, alpha: 0.06 },
            { r: 20, g: 40, b: 90, alpha: 0.05 },
            { r: 30, g: 15, b: 60, alpha: 0.07 },
            { r: 15, g: 50, b: 70, alpha: 0.05 },
            { r: 60, g: 20, b: 50, alpha: 0.05 },
        ];
        this.color = palettes[randInt(0, palettes.length - 1)];
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, this.radiusX);
        const { r, g, b, alpha } = this.color;
        gradient.addColorStop(0, `rgba(${r},${g},${b},${alpha})`);
        gradient.addColorStop(0.5, `rgba(${r},${g},${b},${alpha * 0.5})`);
        gradient.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.ellipse(0, 0, this.radiusX, this.radiusY, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

class OrbitalPath {
    constructor(canvasWidth, canvasHeight) {
        this.centerX = rand(canvasWidth * 0.15, canvasWidth * 0.85);
        this.centerY = rand(canvasHeight * 0.15, canvasHeight * 0.85);
        this.radiusX = rand(canvasWidth * 0.2, canvasWidth * 0.65);
        this.radiusY = rand(canvasHeight * 0.15, canvasHeight * 0.4);
        this.rotation = rand(0, Math.PI);
        this.opacity = rand(0.025, 0.07);
        this.lineWidth = rand(0.4, 1.2);
        this.dashLength = rand(8, 30);
        this.dashGap = rand(12, 40);
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.centerX, this.centerY);
        ctx.rotate(this.rotation);
        ctx.strokeStyle = `rgba(150,180,220,${this.opacity})`;
        ctx.lineWidth = this.lineWidth;
        ctx.setLineDash([this.dashLength, this.dashGap]);
        ctx.beginPath();
        ctx.ellipse(0, 0, this.radiusX, this.radiusY, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
    }
}

class ConstellationNetwork {
    constructor(canvasWidth, canvasHeight) {
        this.nodes = [];
        const nodeCount = CONFIG.constellationNodeCount;
        for (let i = 0; i < nodeCount; i++) {
            this.nodes.push({
                x: rand(canvasWidth * 0.08, canvasWidth * 0.92),
                y: rand(canvasHeight * 0.08, canvasHeight * 0.92),
                radius: rand(1.0, 2.2),
                pulseOffset: rand(0, Math.PI * 2),
            });
        }
        this.connections = [];
        for (let i = 0; i < this.nodes.length; i++) {
            const distances = [];
            for (let j = 0; j < this.nodes.length; j++) {
                if (i === j) continue;
                const dx = this.nodes[i].x - this.nodes[j].x;
                const dy = this.nodes[i].y - this.nodes[j].y;
                distances.push({ index: j, dist: Math.sqrt(dx * dx + dy * dy) });
            }
            distances.sort((a, b) => a.dist - b.dist);
            const connectCount = randInt(1, 3);
            for (let k = 0; k < Math.min(connectCount, distances.length); k++) {
                const j = distances[k].index;
                const pairKey = Math.min(i, j) + '_' + Math.max(i, j);
                if (!this.connections.find(c => c.key === pairKey)) {
                    this.connections.push({ key: pairKey, from: i, to: j });
                }
            }
        }
    }

    draw(ctx, time) {
        for (const conn of this.connections) {
            const from = this.nodes[conn.from];
            const to = this.nodes[conn.to];
            const alpha = 0.04 + Math.sin(time * 0.4 + conn.from) * 0.015;
            ctx.strokeStyle = `rgba(160,190,230,${clamp(alpha, 0.02, 0.08)})`;
            ctx.lineWidth = 0.5;
            ctx.setLineDash([3, 10]);
            ctx.beginPath();
            ctx.moveTo(from.x, from.y);
            ctx.lineTo(to.x, to.y);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        for (const node of this.nodes) {
            const pulse = Math.sin(time * 1.5 + node.pulseOffset) * 0.5 + 0.5;
            const alpha = 0.25 + pulse * 0.35;
            ctx.fillStyle = `rgba(200,220,255,${alpha})`;
            ctx.beginPath();
            ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
            ctx.fill();
            const glowGrad = ctx.createRadialGradient(node.x, node.y, 0, node.x, node.y, node.radius * 5);
            glowGrad.addColorStop(0, `rgba(180,200,240,${alpha * 0.6})`);
            glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = glowGrad;
            ctx.beginPath();
            ctx.arc(node.x, node.y, node.radius * 5, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

class SpaceSimulation {
    constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.width = 0;
        this.height = 0;
        this.stars = [];
        this.shootingStars = [];
        this.characterRainParticles = [];
        this.planets = [];
        this.nebulae = [];
        this.orbitalPaths = [];
        this.constellationNetwork = null;
        this.lastTime = 0;
        this.shootingStarCooldown = 0;
        this.animationId = null;
        this.running = false;
    }

    init() {
        this.handleResize();
        this._createStars();
        this._createPlanets();
        this._createNebulae();
        this._createOrbitalPaths();
        this._createConstellationNetwork();
        this.shootingStarCooldown = rand(
            CONFIG.shootingStarSpawnIntervalMin,
            CONFIG.shootingStarSpawnIntervalMax
        );
        this.lastTime = performance.now();
        this.running = true;
        this.animate(this.lastTime);
        window.addEventListener('resize', this._onResize.bind(this));
    }

    _createStars() {
        const area = this.width * this.height;
        const count = Math.min(CONFIG.starBaseCount, Math.floor(area / 4500));
        this.stars = [];
        for (let i = 0; i < Math.max(count, 80); i++) {
            this.stars.push(new Star(this.width, this.height));
        }
    }

    _createPlanets() {
        this.planets = [];
        for (let i = 0; i < CONFIG.planetCount; i++) {
            this.planets.push(new Planet(this.width, this.height, i));
        }
    }

    _createNebulae() {
        this.nebulae = [];
        for (let i = 0; i < CONFIG.nebulaCount; i++) {
            this.nebulae.push(new NebulaCloud(this.width, this.height));
        }
    }

    _createOrbitalPaths() {
        this.orbitalPaths = [];
        for (let i = 0; i < CONFIG.orbitalPathCount; i++) {
            this.orbitalPaths.push(new OrbitalPath(this.width, this.height));
        }
    }

    _createConstellationNetwork() {
        this.constellationNetwork = new ConstellationNetwork(this.width, this.height);
    }

    _spawnShootingStar() {
        if (this.shootingStars.length >= CONFIG.shootingStarMaxActive) return;
        const shootingStar = new ShootingStar(this.width, this.height);
        this.shootingStars.push(shootingStar);
    }

    _onResize() {
        this.handleResize();
        this._createStars();
        this._createPlanets();
        this._createNebulae();
        this._createOrbitalPaths();
        this._createConstellationNetwork();
    }

    handleResize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const newWidth = window.innerWidth;
        const newHeight = window.innerHeight;
        this.width = newWidth;
        this.height = newHeight;
        this.canvas.width = newWidth * dpr;
        this.canvas.height = newHeight * dpr;
        this.canvas.style.width = newWidth + 'px';
        this.canvas.style.height = newHeight + 'px';
        this.ctx.setTransform(1, 0, 0, 1, 0, 0);
        this.ctx.scale(dpr, dpr);
    }

    update(dt) {
        const time = performance.now() / 1000;

        for (const star of this.stars) {
            star.update(time);
        }

        for (const ss of this.shootingStars) {
            ss.update(dt);
        }

        for (const ss of this.shootingStars) {
            if (ss.spawnedParticles.length > 0) {
                this.characterRainParticles.push(...ss.spawnedParticles);
                ss.spawnedParticles = [];
            }
        }

        for (const particle of this.characterRainParticles) {
            particle.update(dt);
        }

        this.characterRainParticles = this.characterRainParticles.filter(p => !p.isDead);
        while (this.characterRainParticles.length > CONFIG.charRainMaxTotal) {
            this.characterRainParticles.shift();
        }

        this.shootingStars = this.shootingStars.filter(ss => ss.active);

        for (const planet of this.planets) {
            planet.update(dt);
        }

        this.shootingStarCooldown -= dt * 1000;
        if (this.shootingStarCooldown <= 0 && this.shootingStars.length < CONFIG.shootingStarMaxActive) {
            this._spawnShootingStar();
            this.shootingStarCooldown = rand(
                CONFIG.shootingStarSpawnIntervalMin,
                CONFIG.shootingStarSpawnIntervalMax
            );
        }
    }

    draw() {
        const ctx = this.ctx;
        const w = this.width;
        const h = this.height;
        const time = performance.now() / 1000;

        ctx.clearRect(0, 0, w, h);

        for (const nebula of this.nebulae) {
            nebula.draw(ctx);
        }

        for (const orbitalPath of this.orbitalPaths) {
            orbitalPath.draw(ctx);
        }

        if (this.constellationNetwork) {
            this.constellationNetwork.draw(ctx, time);
        }

        for (const planet of this.planets) {
            if (planet.depth > 0.55) {
                planet.draw(ctx);
            }
        }

        for (const star of this.stars) {
            star.draw(ctx);
        }

        for (const planet of this.planets) {
            if (planet.depth <= 0.55) {
                planet.draw(ctx);
            }
        }

        for (const ss of this.shootingStars) {
            ss.draw(ctx);
        }

        for (const particle of this.characterRainParticles) {
            particle.draw(ctx);
        }

        const vignetteGradient = ctx.createRadialGradient(w / 2, h / 2, w * 0.45, w / 2, h / 2, w * 0.85);
        vignetteGradient.addColorStop(0, 'rgba(0,0,0,0)');
        vignetteGradient.addColorStop(1, 'rgba(3,5,10,0.55)');
        ctx.fillStyle = vignetteGradient;
        ctx.fillRect(0, 0, w, h);
    }

    animate(timestamp) {
        if (!this.running) return;
        const dt = Math.min((timestamp - this.lastTime) / 1000, 0.1);
        this.lastTime = timestamp;
        this.update(dt);
        this.draw();
        this.animationId = requestAnimationFrame(this.animate.bind(this));
    }

    destroy() {
        this.running = false;
        if (this.animationId) {
            cancelAnimationFrame(this.animationId);
            this.animationId = null;
        }
        window.removeEventListener('resize', this._onResize.bind(this));
        this.stars = [];
        this.shootingStars = [];
        this.characterRainParticles = [];
        this.planets = [];
        this.nebulae = [];
        this.orbitalPaths = [];
        this.constellationNetwork = null;
    }
}

(function () {
    const canvas = document.getElementById('space-canvas');
    if (!canvas) {
        console.error('Space canvas element not found.');
        return;
    }
    const simulation = new SpaceSimulation(canvas);
    simulation.init();
    window.__spaceSimulation = simulation;
})();
</script>

<script>
// ──────────────────────────────────────
// ACCORDION ENGINE
// ──────────────────────────────────────
function toggleAccordion(elementId) {
  const currentItem = document.getElementById(elementId);
  if (!currentItem) return;
  const currentTrigger = currentItem.querySelector('.accordion-trigger');
  const isActive = currentItem.classList.contains('active');
  
  const allItems = document.querySelectorAll('.accordion-item');
  allItems.forEach(item => {
    item.classList.remove('active');
    const trigger = item.querySelector('.accordion-trigger');
    if (trigger) trigger.setAttribute('aria-expanded', 'false');
  });

  if (!isActive) {
    currentItem.classList.add('active');
    if (currentTrigger) currentTrigger.setAttribute('aria-expanded', 'true');
  }
}
</script>
