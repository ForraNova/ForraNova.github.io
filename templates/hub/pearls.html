/* ===============================

================================ */

header {

}
.nav-container {

    align-items: center;
    justify-content: space-between;

}

.logo-component {
    position: relative;

    margin-left: 10px;

    perspective: 1000px;
    background: transparent;
    float: left;
}
.logo-layer { position: absolute; background-repeat: no-repeat; background-size: contain; background-position: center; }
.layer-bg-logo { width: var(--bg-logo-size); height: var(--bg-logo-size); top: var(--bg-logo-top); left: var(--bg-logo-left); z-index: 1000; }
.layer-brain {
    width: var(--brain-size); height: var(--brain-size); top: var(--brain-top); left: var(--brain-left);
    z-index: 2000; animation: heartbeat var(--heartbeat-speed) ease-in-out infinite; transform-origin: center center;
    filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.65));
}
.layer-text {
    width: var(--text-width); height: calc(var(--text-width) * 0.25); bottom: var(--text-bottom); left: var(--text-left);
    z-index: 3000; transform-style: preserve-3d; animation: spin3D var(--spin-speed) linear infinite;
}
@keyframes heartbeat {
    0% { transform: scale(1); } 25% { transform: scale(1.05); } 45% { transform: scale(1.02); }
    65% { transform: scale(1.07); } 100% { transform: scale(1); }
}

.logo{
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

/* ===============================
   SLIDE LAYOUT
================================ */
#app-root { 
    position: relative; 
    z-index: 1; 
    padding-top: 150px; 
    margin: auto; 
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.slide-page { width: 100%; }

.slide-view {
    min-height: calc(100vh - 90px);
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 60px 40px 60px 130px;
    position: relative;
    background: var(--background);


}
.slide-view::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 2px;
    background: linear-gradient(90deg, var(--accent-cyan), var(--accent-violet));
    box-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
}

.slide-title {
    border-left: 4px solid var(--accent-cyan);
    padding-left: 22px;
    margin-bottom: 36px;
    width: 100%;
}

.card {
    background: var(--card-bg);
    border: 1px solid var(--border-light);
    border-radius: 20px;
    padding: 28px 22px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: var(--shadow-sm);
    text-align: center;
    transition: transform 0.25s ease, border-color 0.25s ease;
    position: relative;
    overflow: hidden;
}
.card::before {
    content: '';
    position: absolute; top: 0; left: 0; width: 3px; height: 100%;
    background: linear-gradient(180deg, var(--accent-cyan), var(--accent-violet));
}
.card:hover { transform: translateY(-6px); border-color: rgba(0, 229, 255, 0.45); }
.card1 { background: var(--card-bg); border: 1px solid var(--border-light); border-radius: 20px; padding: 20px; text-align: center; transition: transform 0.25s ease; }
.card1:hover { transform: translateY(-6px); }

.grid {
    display: grid;

    gap: 24px;
    width: 100%;
    height: 100%;
}
.grid-3 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
    width: 100%;
    height: 100%;
}
.full-grid-section { display: flex; flex-direction: column; justify-content: center; width: 100%; max-width: 1400px; margin: 0 auto; flex: 1; }

.two-col-layout { display: flex; flex-wrap: wrap; gap: 40px; align-items: center; }
.two-col-layout > div { flex: 1; min-width: 260px; }

.img-placeholder {

    border: 1px solid var(--border-light);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 260px;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

.styled-table { width: 100%; background: var(--card-bg); border: 1px solid var(--border-light); border-radius: 16px; overflow: hidden; border-collapse: collapse; }
th, td { padding: 16px; text-align: left; font-weight: 600; }
th { background: linear-gradient(120deg, var(--accent-cyan), var(--accent-violet)); color: #041014; }
td { color: var(--text-secondary); }

.btn-practice, .download-btn {

}
.btn-practice:hover, .download-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 229, 255, 0.35); }
.btn-practice a { color: #041014; }

picture source, img { border-radius: 16px; }
.illustration { max-width: 100%; border-radius: 16px; box-shadow: var(--shadow-sm); margin: 10px 0; }

.media-row { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: center; margin-top: 20px; }

.qa-card { background: var(--card-bg); border: 1px solid var(--border-light); border-radius: 24px; padding: 30px; margin: 30px 0; backdrop-filter: blur(10px); }

.chatshowtag {

footer a { color: var(--accent-cyan); text-decoration: none; font-weight: 600; }
a { text-decoration: none; }

.dropdown { position: relative; display: inline-block; }
.dropdown-content {
    display: none; position: absolute; background-color: rgba(15, 17, 32, 0.95);

}

/* ===============================
   LEFT-SIDE NAVIGATION + PAGINATION

================================ */
.nav-bar {

            llms: focus,
            philosophySlide: createPhilosophy,
            pearlsSlide: createPearls,
            detailSlide: () => { return ""; }, // handled individually
            comparisonSlide: createComparison,
            apply: outCome,
            advancedSlide: createAdvanced,
            qaSlide: createQa,
            outroSlide: createOutro
        };

</script>
<script>
/* ===============================================================
   SLIDE DECK CONTROLLER (modernized, class-based, reusable)
   Consumes the exact, unmodified content defined above
   (slidesData, components, createDetailSlide, getPracticals, ...)
   =============================================================== */
(() => {
    'use strict';

    // Exact detail-slide copy from the original pearls.html, preserved
    // verbatim and simply wrapped in a lookup function instead of an
    // inline if/else chain.
    function getDetailContent(letter) {
        let title = "", desc = "";
        if (letter === "P") { title = "🧑‍🏫 Persona: Expert Role"; desc = "Assign an expert role – narrow the AI's knowledge to a specific professional frequency."; }
        if (letter === "E") { title = "📄 Example: Context Anchoring"; desc = "Provide 1, 2, or 3 examples of how you want the present work to be done. This helps to anchor the AI with past data, newsletters, or sample reports. Example: Provide past school data, previous memos, or sample reports. This grounds the AI in your school’s unique history, pattern  and voice."; }
        if (letter === "A") { title = "⚡ Action: Command Verbs"; desc = "Use high-impact directives, Command verb, like: Draft, Synthesize, Audit, Benchmark. Avoid 'help me' — demand output."; }
        if (letter === "R") { title = "📊 Results: Visual Output"; desc = "Specify output format, like: bullet points, table, checklist, paragraphs etc. School owners need clear dashboards, not paragraphs."; }
        if (letter === "L") { title = "🛡️ Limit: Clearly state safety Guardrails"; desc = "Set boundaries, like: word count, tone, banned terms. Eg: 'No budget figures, under 150 words.'"; }
        if (letter === "S") { title = "🔍 Scrutiny: Human-in-Loop"; desc = " To avoid AI Hallucination, always verify AI output for bias, errors, alignment with school values. Review and fact-check to ensure it aligns with your values. You are the final principal."; }
        return { title, desc };
    }

    class SlideDeck {
        constructor({ rootSelector, navDotsSelector, pageCurrentSelector, pageTotalSelector, prevSelector, nextSelector }) {
            this.root = document.querySelector(rootSelector);
            this.navDots = document.querySelector(navDotsSelector);
            this.pageCurrent = document.querySelector(pageCurrentSelector);
            this.pageTotal = document.querySelector(pageTotalSelector);
            this.prevArrow = document.querySelector(prevSelector);
            this.nextArrow = document.querySelector(nextSelector);

            this.slides = [];
            this.currentIndex = 0;

            this._renderSlide = this._renderSlide.bind(this);
        }

        /** Resolve one slide's HTML using the untouched content functions. */
        _renderSlide(slide) {
            if (slide.component === "detailSlide") {
                const { title, desc } = getDetailContent(slide.meta);
                return createDetailSlide(slide.meta, title, desc);
            }
            const factory = components[slide.component];
            return typeof factory === "function" ? factory() : "";
        }

        build() {
            this.root.innerHTML = "";
            this.slides = slidesData.map((slide, idx) => {
                const wrapper = document.createElement("div");
                wrapper.id = `slide-${slide.id}`;
                wrapper.className = "slide-page";
                wrapper.style.display = idx === 0 ? "block" : "none";
                wrapper.innerHTML = this._renderSlide(slide);
                this.root.appendChild(wrapper);
                return { id: slide.id, title: slide.title, element: wrapper };
            });
            this._renderNavDots();
            this._renderPagination();
            this.show(0);
            return this;
        }

        _renderNavDots() {
            this.navDots.innerHTML = "";
            this.slides.forEach((slide, i) => {
                const dot = document.createElement("div");
                dot.className = "nav-dot";
                dot.title = slide.title;
                if (i === this.currentIndex) dot.classList.add("active");
                dot.addEventListener("click", () => this.show(i));
                this.navDots.appendChild(dot);
            });
        }

        _renderPagination() {
            if (this.pageTotal) this.pageTotal.textContent = String(this.slides.length);
        }

        show(index) {
            const clamped = Math.max(0, Math.min(index, this.slides.length - 1));
            this.slides.forEach((slide, i) => {
                slide.element.style.display = i === clamped ? "block" : "none";
            });
            this.currentIndex = clamped;

            this.navDots.querySelectorAll(".nav-dot").forEach((dot, i) => {
                dot.classList.toggle("active", i === clamped);
            });
            if (this.pageCurrent) this.pageCurrent.textContent = String(clamped + 1);

            if (this.prevArrow) this.prevArrow.classList.toggle("disabled", clamped === 0);
            if (this.nextArrow) this.nextArrow.classList.toggle("disabled", clamped === this.slides.length - 1);

            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        next() { this.show(this.currentIndex + 1); }
        prev() { this.show(this.currentIndex - 1); }

        bindControls() {
            if (this.prevArrow) this.prevArrow.addEventListener("click", () => this.prev());
            if (this.nextArrow) this.nextArrow.addEventListener("click", () => this.next());

            window.addEventListener("keydown", (e) => {
                if (e.key === "ArrowRight") this.next();
                if (e.key === "ArrowLeft") this.prev();
            });

            // lightweight swipe support
            let touchStartX = 0;
            window.addEventListener("touchstart", (e) => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
            window.addEventListener("touchend", (e) => {
                const delta = e.changedTouches[0].screenX - touchStartX;
                if (Math.abs(delta) < 50) return;
                delta < 0 ? this.next() : this.prev();
            }, { passive: true });

            return this;
        }
    }

    /* ===============================
       THEME (dark/light) — persisted
       ================================ */
    class ThemeController {
        constructor(toggleSelector) {
            this.toggle = document.querySelector(toggleSelector);
        }
        init() {
            const saved = localStorage.getItem("theme");
            if (saved === "light") {
                document.body.classList.remove("dark");
                document.body.classList.add("light");
            } else {
                document.body.classList.add("dark");
            }
            this.toggle.addEventListener("click", () => {
                const isDark = document.body.classList.contains("dark");
                document.body.classList.toggle("dark", !isDark);
                document.body.classList.toggle("light", isDark);
                localStorage.setItem("theme", isDark ? "light" : "dark");
            });
            return this;
        }
    }

    /* ===============================
       RESPONSIVE HAMBURGER NAV
       ================================ */
    class HamburgerNav {
        constructor(hamburgerSelector, navSelector) {
            this.hamburger = document.querySelector(hamburgerSelector);
            this.nav = document.querySelector(navSelector);
        }
        init() {
            this.hamburger.addEventListener("click", () => {
                this.nav.classList.toggle("active");
                this.hamburger.classList.toggle("active");
            });
            this.nav.querySelectorAll("ul li a").forEach((link) => {
                link.addEventListener("click", () => {
                    this.nav.classList.remove("active");
                    this.hamburger.classList.remove("active");
                });
            });
            return this;
        }
    }

    /* ===============================
       BOOTSTRAP
       ================================ */
    document.addEventListener("DOMContentLoaded", () => {
        new ThemeController("#darkModeToggle").init();
        new HamburgerNav("#hamburger-menu", "#main-nav").init();

        window.pearlsDeck = new SlideDeck({
            rootSelector: "#app-root",
            navDotsSelector: "#navDots",
            pageCurrentSelector: "#pageCurrent",
            pageTotalSelector: "#pageTotal",
            prevSelector: "#prevArrow",
            nextSelector: "#nextArrow"
        }).build().bindControls();
    });
})();

</script>

  <script>
    (function() {
      "use strict";

      // ============================================================
      // 1. CONFIGURATION & GLOBAL STATE
      // ============================================================
      const canvas = document.getElementById('terrain-canvas');

      // ---------- SCENE PARAMETERS ----------
      const CONFIG = {
        bgColor: 0x0a0a12,
        fogColor: 0x0a0a12,
        fogDensity: 0.018,
        // Terrain geometry
        segmentsX: 60,        // resolution along X (width of mesh)
        segmentsZ: 90,        // resolution along Z (depth of mesh)
        planeWidth: 260,      // world units
        planeDepth: 320,      // world units
        // Wave parameters
        waveAmplitude: 9.0,   // max height of terrain
        waveSpeed: 0.6,       // animation speed
        waveFreqX: 0.09,      // frequency along X
        waveFreqZ: 0.05,      // frequency along Z
        // Forward motion
        forwardSpeed: 38,     // world units per second
        // Colors
        wireColor: 0x00e0ff,  // neon cyan
        wireOpacity: 0.55,    // base opacity of lines
        // Camera
        camHeight: 22,
        camTilt: -0.18,       // radians (looking slightly down)
        camZ: 35,             // camera position along Z
      };

      // ---------- DIMENSIONS ----------
      let width = window.innerWidth;
      let height = window.innerHeight;

      // ---------- TIME / MOTION STATE ----------
      let startTime = null;
      let lastTimestamp = 0;
      let animationFrameId = null;

      // ---------- MOUSE (for subtle camera sway) ----------
      const mouse = {
        x: 0.5,
        y: 0.5,
        targetX: 0.5,
        targetY: 0.5,
      };

      // ============================================================
      // 2. THREE.JS SETUP
      // ============================================================
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(CONFIG.bgColor);

      // Exponential fog for seamless horizon fade
      scene.fog = new THREE.FogExp2(CONFIG.fogColor, CONFIG.fogDensity);

      // Perspective camera
      const camera = new THREE.PerspectiveCamera(
        60,                              // FOV
        width / height,                  // Aspect
        0.1,                             // Near
        600                              // Far
      );
      camera.position.set(0, CONFIG.camHeight, CONFIG.camZ);
      camera.rotation.x = CONFIG.camTilt;

      // Renderer
      const renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true,
        alpha: false,
        powerPreference: 'high-performance',
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(width, height);

      // ============================================================
      // 3. TERRAIN GEOMETRY
      // ============================================================
      // Create a plane geometry subdivided into a grid of vertices.
      // We'll displace the Y coordinate of each vertex using a
      // composite sine/cosine function to simulate terrain.
      const geometry = new THREE.PlaneGeometry(
        CONFIG.planeWidth,
        CONFIG.planeDepth,
        CONFIG.segmentsX,
        CONFIG.segmentsZ
      );

      // Rotate the plane so it lies flat on the XZ plane (default is XY)
      geometry.rotateX(-Math.PI / 2);

      // Cache the original vertex positions so we can recompute
      // heights each frame without accumulating errors.
      const positionAttribute = geometry.attributes.position;
      const vertexCount = positionAttribute.count;
      const basePositions = new Float32Array(vertexCount * 3);
      basePositions.set(positionAttribute.array);

      // ============================================================
      // 4. WIREFRAME MATERIAL
      // ============================================================
      // MeshBasicMaterial with wireframe=true gives us glowing lines.
      // We use additive blending to make overlapping lines brighter.
      const terrainMaterial = new THREE.MeshBasicMaterial({
        color: CONFIG.wireColor,
        wireframe: true,
        transparent: true,
        opacity: CONFIG.wireOpacity,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });

      const terrain = new THREE.Mesh(geometry, terrainMaterial);
      scene.add(terrain);

      // ============================================================
      // 5. VERTEX DISPLACEMENT (TERRAIN HEIGHT FUNCTION)
      // ============================================================
      /**
       * Compute the height for a given vertex at (x, z) and time t.
       * Combines multiple sine waves for organic, non-repeating terrain.
       * @param {number} x - world X coordinate
       * @param {number} z - world Z coordinate
       * @param {number} t - elapsed time in seconds
       * @returns {number} height offset (Y value)
       */
      function terrainHeight(x, z, t) {
        // Primary undulating wave – large mountains
        const wave1 = Math.sin(x * CONFIG.waveFreqX + t * CONFIG.waveSpeed * 0.9) *
                      Math.cos(z * CONFIG.waveFreqZ + t * CONFIG.waveSpeed * 0.7);

        // Secondary diagonal wave – adds ridges
        const wave2 = Math.sin((x + z) * 0.045 + t * CONFIG.waveSpeed * 1.3) * 0.6;

        // Tertiary high-frequency wave – fine detail
        const wave3 = Math.sin(x * 0.22 + z * 0.18 + t * CONFIG.waveSpeed * 2.0) * 0.25;

        // Quaternary slow swell – large-scale elevation changes
        const wave4 = Math.cos((x - z) * 0.02 + t * 0.35) * 0.8;

        // Combine waves and scale by amplitude
        return (wave1 + wave2 + wave3 + wave4) * CONFIG.waveAmplitude * 0.5;
      }

      /**
       * Update all vertex Y positions based on current time.
       * Also scrolls the terrain forward along Z to simulate flight.
       */
      let scrollOffset = 0;
      function updateTerrain(t, dt) {
        // Advance scroll offset (forward motion)
        scrollOffset += CONFIG.forwardSpeed * dt;

        // The plane's local Z positions range from -depth/2 to +depth/2.
        // We use scrollOffset to shift the sampling position, creating
        // the illusion of endless forward travel.
        const positions = positionAttribute.array;

        for (let i = 0; i < vertexCount; i++) {
          const i3 = i * 3;
          const x = basePositions[i3];
          const z = basePositions[i3 + 2];

          // Sample terrain height using scrolled Z coordinate
          const y = terrainHeight(x, z + scrollOffset, t);

          // Write back the displaced Y
          positions[i3 + 1] = y;
        }

        // Mark the attribute for update on GPU
        positionAttribute.needsUpdate = true;

        // Recompute bounding sphere for proper frustum culling
        geometry.computeBoundingSphere();
      }

      // ============================================================
      // 6. MOUSE INTERACTION (subtle camera sway)
      // ============================================================
      function handleMouseMove(e) {
        mouse.targetX = e.clientX / window.innerWidth;
        mouse.targetY = e.clientY / window.innerHeight;
      }

      function handleMouseLeave() {
        mouse.targetX = 0.5;
        mouse.targetY = 0.5;
      }

      function handleTouchMove(e) {
        if (e.touches.length > 0) {
          mouse.targetX = e.touches[0].clientX / window.innerWidth;
          mouse.targetY = e.touches[0].clientY / window.innerHeight;
        }
      }

      window.addEventListener('mousemove', handleMouseMove, { passive: true });
      window.addEventListener('mouseleave', handleMouseLeave);
      window.addEventListener('touchmove', handleTouchMove, { passive: true });

      // ============================================================
      // 7. RESIZE HANDLING
      // ============================================================
      function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;

        camera.aspect = width / height;
        camera.updateProjectionMatrix();

        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      }

      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(resizeCanvas, 100);
      });

      // ============================================================
      // 8. MAIN ANIMATION LOOP
      // ============================================================
      function animate(timestamp) {
        if (!startTime) {
          startTime = timestamp;
          lastTimestamp = timestamp;
        }

        const elapsed = (timestamp - startTime) * 0.001; // seconds
        let dt = (timestamp - lastTimestamp) * 0.001;
        lastTimestamp = timestamp;

        // Cap delta time to avoid huge jumps after tab switch
        dt = Math.min(dt, 0.05);

        // ---------- Terrain displacement ----------
        updateTerrain(elapsed, dt);

        // ---------- Smooth mouse interpolation ----------
        mouse.x += (mouse.targetX - mouse.x) * 0.04;
        mouse.y += (mouse.targetY - mouse.y) * 0.04;

        // ---------- Subtle camera sway based on mouse ----------
        // Small horizontal and vertical offsets for parallax feel
        const swayX = (mouse.x - 0.5) * 8;
        const swayY = (mouse.y - 0.5) * 4;

        camera.position.x = swayX;
        camera.position.y = CONFIG.camHeight + swayY;
        camera.position.z = CONFIG.camZ;

        // Look slightly ahead and follow mouse
        camera.lookAt(
          swayX * 0.5,
          CONFIG.camHeight * 0.3,
          -80
        );

        // ---------- Render ----------
        renderer.render(scene, camera);

        animationFrameId = requestAnimationFrame(animate);
      }

      // ============================================================
      // 9. INITIALIZATION
      // ============================================================
      // Set initial camera look direction
      camera.lookAt(0, CONFIG.camHeight * 0.3, -80);

      // Start animation
      animationFrameId = requestAnimationFrame(animate);

      // ============================================================
      // 10. VISIBILITY CHANGE (pause when hidden)
      // ============================================================
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          if (animationFrameId) {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
          }
        } else {
          if (!animationFrameId) {
            startTime = null;
            lastTimestamp = 0;
            animationFrameId = requestAnimationFrame(animate);
          }
        }
      });

      // ============================================================
      // 11. CLEANUP
      // ============================================================
      window.addEventListener('beforeunload', () => {
        if (animationFrameId) {
          cancelAnimationFrame(animationFrameId);
        }
        // Dispose of geometry and material to free GPU memory
        geometry.dispose();
        terrainMaterial.dispose();
        renderer.dispose();
      });

    })();
  </script>
