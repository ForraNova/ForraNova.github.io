<style>
/* ===============================
   Background Animation host
   (structure preserved from finAI_.html)
================================ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      font-family: monospace;
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: background 0.3s, color 0.2s;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #space {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;

      display: block;

    }

    .hud {
      position: relative;
      z-index: 20;
      pointer-events: none;
      mix-blend-mode: screen;
      letter-spacing: 0.1em;
    }

/* ===============================
   FUTURISTIC THEME TOKENS
================================ */

body.dark {
    --bg-page: #05060c;
    --slide-bg: rgba(10, 13, 24, 0.55);
    --text-primary: #eaf2ff;
    --text-secondary: #a7b4d4;
    --text-muted: #6b7796;

    --accent-cyan: #ff9f43;
    --accent-violet: #ff4757;

    --card-bg: rgba(22, 27, 46, 0.55);
    --border-light: rgba(0, 229, 255, 0.18);
    --nav-dot-bg: rgba(167, 180, 212, 0.35);
    --nav-dot-active: #ff4757;
    --opaque: rgba(0, 229, 255, 0.05);
    --transition: all 0.35s cubic-bezier(255, 255, 255, 0.94);
    --shadow-sm: 0 20px 45px -12px rgba(255, 255, 255, 0.55);
    --accent-emerald: #2df7a3;
    --accent-amber: #ffb84d;
    --grid-line: rgba(0, 229, 255, 0.08);
}

/* light mode = "daylight lab" inversion, still futuristic */
body.light {
    --bg-page: #fff;
    --slide-bg: rgba(255, 255, 255, 0.72);
    --text-primary: #0b0f1e;
    --text-secondary: #2c3552;
    --text-muted: #5b6584;

    --accent-cyan: #ff4757;
    --accent-violet: #ff9f43;
    
    --card-bg: rgba(255, 255, 255, 0.6);
    --border-light: rgba(8, 145, 178, 0.25);
    --nav-dot-bg: rgba(44, 53, 82, 0.25);
    --nav-dot-active: #ff9f43;
    --opaque: rgba(8, 145, 178, 0.06);
    --transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    --shadow-sm: 0 20px 45px -12px rgba(0, 0, 0, 0.55);
    --accent-emerald: #059669;
    --accent-amber: #d97706;
    --grid-line: rgba(8, 145, 178, 0.06);
}

body {
    font-family: 'Inter', sans-serif;
    color: var(--text-primary);
    overflow: hidden;
    transition: var(--transition);
    height: 100vh;
    width: 100vw;
}

/* ===============================
   HEADER AND NAVIGATION
   (structure preserved from finAI_.html — restyled)
================================ */
header {
    position: fixed;
    top: 5px;
    width: 100%;
    max-height: 110px;
    z-index: 1000;
    background: rgba(5, 6, 12, 0.45);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(0, 229, 255, 0.15);
    margin-top: -20px;
}

.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    white-space: nowrap;
    padding: 5px 5%;
    color: var(--accent-cyan);
}

.slogan {
    font-size: 1.1rem;
    flex-direction: column;
    text-align: center;
    color: #00e0ff;
    padding-right: -50px;
    margin-left: -50px;
    font-family: 'Space Grotesk', sans-serif;
    letter-spacing: 0.5px;
    text-shadow: 0 0 18px rgba(0, 229, 255, 0.45);
}

.foota {
    z-index: -0.3;
    height: 55px;
    filter: drop-shadow(0 0 10px rgba(128, 255, 255, 0.6));
}

.nav-links a {
    font-size: 1.2rem;
    transition: 0.3s;
    color: #cfe9ff;
    text-decoration: none;
    letter-spacing: 0.3px;
    font-family: 'Space Grotesk', sans-serif;
    text-transform: uppercase;
}

.nav-links li {
    margin-left: 22px;
    font-weight: 600;
    position: relative;
}

.nav-links li::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: -6px;
    width: 0%;
    height: 1px;
    background: var(--accent-cyan);
    transition: width 0.25s ease;
}

.nav-links li:hover::after { width: 100%; }
.nav-links li:hover a, .nav-links a:hover { color: var(--accent-cyan); }

.nav-links {
    list-style: none;
    display: flex;
    gap: 8px;
}

.menu-toggle {
    display: none;
    cursor: pointer;
    flex-direction: column;
    gap: 5px;
}

.menu-toggle .bar {
    width: 25px;
    height: 2px;
    background-color: #00e0ff;
    transition: all 0.3s ease;
    box-shadow: 0 0 6px rgba(0, 229, 255, 0.6);
}

@media screen and (max-width: 900px) {
    .menu-toggle { display: flex; }
    .nav-links {
        display: none;
        flex-direction: column;
        width: 100%;
        position: absolute;
        top: 90px;
        left: 0;
        background: rgba(5, 6, 12, 0.97);
        text-align: center;
        padding: 10px 0;
        border-bottom: 1px solid rgba(0,229,255,0.2);
    }
    .nav-links.active, .nav-links.open { display: flex; }
    .nav-links li { margin: 10px 0; }
    .menu-toggle.active .bar {
        width: 3px;
        height: 22px;
        margin: 0 2px;
        display: inline-block;
    }
    .menu-toggle.active { flex-direction: row; gap: 4px; }
}

/* ================== Animated Logo ==================
   (kept structurally identical — geometry vars preserved)
   ============================================================ */
:root {
    --canvas-width: 150px;
    --canvas-height: 160px;
    --bg-logo-sizeW: 92px;
    --bg-logo-sizeH: 92px;
    --bg-logo-top: 14px;
    --bg-logo-left: 28px;
    --brain-size: 56px;
    --brain-top: 30px;
    --brain-left: 60px;
    --heartbeat-speed: 2s;
    --text-width: 158px;
    --text-bottom: 28px;
    --text-down: 18px;
    --text-left: -10px;
    --spin-speed: 6s;
}

.logo-component {
    position: relative;
    width: var(--canvas-width);
    height: var(--canvas-height);
    margin-left: 20px;
    overflow: hidden;
    perspective: 1000px;
    background: transparent;
    float: left;
}
.logo-layer {
    position: absolute;
    background-repeat: no-repeat;
    background-size: contain;
    background-position: center;
}
.layer-bg-logo {
    width: var(--bg-logo-sizeW);
    height: var(--bg-logo-sizeH);
    top: var(--bg-logo-top);
    left: var(--bg-logo-left);
    z-index: 1000;
    border-radius: 50%;
}
.layer-brain {
    width: var(--brain-size);
    height: var(--brain-size);
    top: var(--brain-top);
    left: var(--brain-left);
    z-index: 2000;
    animation: heartbeat var(--heartbeat-speed) ease-in-out infinite;
    transform-origin: center center;
    filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.65));
}
.layer-text {
    width: var(--text-width);
    height: calc(var(--text-width) * 0.25);
    bottom: var(--text-bottom);
    left: var(--text-left);
    z-index: 3000;
    transform-style: preserve-3d;
    animation: spin3D var(--spin-speed) linear infinite;
}

@keyframes heartbeat {
    0% { transform: scale(1); }
    25% { transform: scale(1.05); }
    45% { transform: scale(1.02); }
    65% { transform: scale(1.07); }
    100% { transform: scale(1); }
}
@keyframes spin3D {
    0% { transform: rotateY(0deg); }
    100% { transform: rotateY(360deg); }
}
@media (max-width: 600px) {
    .logo-component { overflow: visible; margin-left: 20px; }
    .layer-text { bottom: var(--text-down); }
}

/* MAIN APP LAYOUT */
.app-container {
    display: flex;
    top: 100px;
    height: 90%;
    width: 100%;
    position: relative;
    left: -15px;
}

/* LEFT NAVIGATION — vertical dot rail
   (structure preserved from finAI_.html — restyled futuristic) */
.nav-dots-bar {
    position: fixed;
    transform: rotate(90deg);
    left: -200px;
    top: 50%;
    background: rgba(8, 10, 20, 0.65);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 60px;
    padding: 16px 12px;
    display: flex;
    flex-direction: row;
    gap: 16px;
    z-index: 1000;
    box-shadow: 0 8px 30px rgba(0, 229, 255, 0.12);
    border: 1px solid rgba(0, 229, 255, 0.22);
    transition: var(--transition);
}
.nav-dot {
    width: 18px;
    height: 18px;
    background: var(--nav-dot-bg);
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.2s ease;
    opacity: 0.6;
    position: relative;
}
.nav-dot.active {
    background: var(--nav-dot-active);
    transform: scale(1.55);
    opacity: 1;
    box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.22), 0 0 14px rgba(0, 229, 255, 0.65);
}
.nav-dot:hover {
    opacity: 1;
    transform: scale(1.25);
    background: var(--accent-cyan);
}

/* SLIDES CONTAINER */
.slides-container {
    flex: 1;
    margin-left: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
    position: relative;
    touch-action: pan-y;
}
.slide-view {
    width: 100%;
    max-width: 1180px;
    height: 80vh;
    min-height: 570px;
    background: var(--slide-bg);
    box-shadow: var(--shadow-sm);
    overflow-y: auto;
    padding: 44px 52px;
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease;
    scrollbar-width: thin;
    border-radius: 18px;
    margin-top: -40px;
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border: 1px solid var(--border-light);
    position: relative;
}
.slide-view::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent-cyan), var(--accent-violet), transparent);
    opacity: 0.8;
}
@keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(24px) scale(0.985); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}
.slide-view.entering { animation: fadeSlideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1); }

/* swipe transient transforms */
.slide-view.swipe-out-left  { transform: translateX(-60px); opacity: 0; }
.slide-view.swipe-out-right { transform: translateX(60px); opacity: 0; }
.slide-view.swipe-out-down  { transform: translateY(60px) scale(0.96); opacity: 0; }

.slide-view::-webkit-scrollbar { width: 6px; }
.slide-view::-webkit-scrollbar-track { background: transparent; }
.slide-view::-webkit-scrollbar-thumb { background: var(--accent-cyan); border-radius: 8px; }

.dark-mode-toggle {
    position: fixed;
    top: 105px;
    right: 12px;
    z-index: 1100;
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    border-radius: 60px;
    width: 46px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(0, 229, 255, 0.15);
    transition: 0.2s;
    border: 1px solid var(--border-light);
}
.fa-moon, .fa-sun { font-size: 1.25rem; color: var(--accent-cyan); }

/* gesture hint indicator */
.gesture-hint {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1050;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    background: rgba(8, 10, 20, 0.85);
    border: 1px solid var(--border-light);
    border-radius: 40px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.4px;
    backdrop-filter: blur(14px);
    opacity: 0.85;
    pointer-events: none;
    transition: opacity 0.4s ease;
}
.gesture-hint i { color: var(--accent-cyan); }
.gesture-hint.fade { opacity: 0; }

/* progress rail (top thin bar) */
.progress-rail {
    position: fixed;
    top: 0; left: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent-cyan), var(--accent-violet));
    z-index: 1200;
    transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: 0 0 10px rgba(0, 229, 255, 0.7);
}

/* slide counter */
.slide-counter {
    position: fixed;
    bottom: 22px;
    right: 24px;
    z-index: 1050;
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    letter-spacing: 1px;
    color: var(--text-muted);
    background: rgba(8, 10, 20, 0.55);
    border: 1px solid var(--border-light);
    padding: 6px 12px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
}
.slide-counter span { color: var(--accent-cyan); font-weight: 600; }

/* prev/next arrow controls */
.slide-arrow {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    z-index: 1050;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(8, 10, 20, 0.55);
    border: 0px solid var(--border-light);
    color: var(--accent-cyan);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: 0.2s;
}
.slide-arrow:hover { background: rgba(0, 229, 255, 0.15); transform: translateY(-50%) scale(1.08); }
.slide-arrow.prev { right: 84px; }
.slide-arrow.next { right: 24px; }
.slide-arrow:disabled, .slide-arrow.disabled { opacity: 0.25; pointer-events: none; }

@media (max-width: 1400px) {
    .nav-dots-bar { left: -200px; padding: 12px 8px; gap: 12px; }
}
@media (max-width: 860px) {
    .nav-dots-bar { left: -220px; padding: 12px 8px; gap: 12px; }
    .slides-container { margin-left: 70px; padding: 16px; }
    .slide-view { padding: 30px 22px; height: 82vh; }
    .pillar-grid, .tool-grid { grid-template-columns: 1fr; }
    .slide-arrow { display: flex;}
}
@media (max-width: 580px) {
    .nav-dots-bar { left: -215px; gap: 10px; padding: 12px 6px; }
    .slide-view { padding: 22px 16px; }
    h2 { font-size: 1.9rem; }
        .slide-arrow { display: flex;}

}

/* ===============================
   TYPOGRAPHY & CONTENT SYSTEM
   (redesigned — AI for Smarter Schools)
================================ */
h1, h2, h3, .display-head {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    letter-spacing: -0.01em;
}
.eyebrowHead {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.55rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent-cyan);
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    padding: 6px 14px 6px 10px;
}
.eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.95rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent-cyan);
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    padding: 6px 14px 6px 10px;
    border: 1px solid var(--border-light);
    border-radius: 5px;
    background: var(--opaque);
}
.eyebrow::before {
    content: '';
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-cyan);
    box-shadow: 0 0 10px var(--accent-cyan);
    flex-shrink: 0;
}
.cyan-accent { color: var(--accent-cyan); }
.violet-accent { color: var(--accent-violet); }
.emerald-accent { color: var(--accent-emerald); }
.amber-accent { color: var(--accent-amber); }
.gradient-text {
    background: linear-gradient(120deg, var(--accent-cyan), var(--accent-violet));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}
h1 { font-size: 2.5rem; line-height: 1.14; margin-bottom: 14px; }
h2 { font-size: 2rem; line-height: 1.2; margin-bottom: 10px; letter-spacing: -0.02em; }
h3 { font-size: 1.2rem; margin-bottom: 8px; }
p { color: var(--text-secondary); line-height: 1.7; }
.lede { font-size: 1.08rem; color: var(--text-secondary); max-width: 780px; }
.slide-view a { color: var(--accent-cyan); text-decoration: none; font-weight: 600; }
.slide-view a:hover { text-decoration: underline; }

.badge {
    display: inline-block;
    background: linear-gradient(120deg, var(--accent-cyan), var(--accent-violet));
    color: #041014;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 30px;
    letter-spacing: 0.5px;
    margin-bottom: 16px;
    font-family: 'JetBrains Mono', monospace;
}

hr {
    border: none;
    margin: 24px 0;
    border-top: 1px solid var(--border-light);
}

/* ===============================
   SLIDE INDEX RIBBON
   small numbered marker echoing the keypad/dot navigation
================================ */
.slide-index {
    position: absolute;
    top: 20px;
    right: 28px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--text-muted);
    border: 1px solid var(--border-light);
    border-radius: 20px;
    padding: 4px 12px;
    background: var(--opaque);
}

/* ===============================
   GRID SYSTEMS — asymmetric "console" bento grid
================================ */
.pillar-grid, .tool-grid, .insight-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
    gap: 18px;
    margin: 26px 0;
}
.XX { grid-template-columns: repeat(auto-fit, minmax(370px, 1fr));
}

.pillar-card, .tool-card {
    background:
        linear-gradient(var(--card-bg), var(--card-bg)) padding-box,
        linear-gradient(135deg, var(--accent-cyan), transparent 60%) border-box;
    border-radius: 4px 18px 4px 18px;
    padding: 24px 22px 22px;
    transition: transform 0.28s ease, box-shadow 0.28s ease;
    border: 1px solid transparent;
    position: relative;
    overflow: hidden;
}
.pillar-card::after, .tool-card::after {
    content: '';
    position: absolute;
    top: -30%; right: -30%;
    width: 120px; height: 120px;
    background: radial-gradient(circle, var(--accent-violet) 0%, transparent 70%);
    opacity: 0.18;
    pointer-events: none;
}
.pillar-card:hover, .tool-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 16px 36px -18px rgba(0, 229, 255, 0.35);
}
.pillar-card i, .tool-card i {
    font-size: 1.15rem;
    color: var(--bg-page);
    background: linear-gradient(135deg, var(--accent-amber), var(--accent-cyan), var(--accent-emerald), var(--accent-violet));
    width: 42px; height: 42px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 16px;
}
.pillar-card h3, .tool-card h3 { font-size: 1.29rem; margin-bottom: 8px; }
.pillar-card p, .tool-card p { font-size: 1.14rem; }
.tool-card .tier {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 12px;
    margin-bottom: 10px;
}
.tier.free { background: rgba(45, 247, 163, 0.15); color: var(--accent-emerald); }
.tier.paid { background: rgba(139, 92, 246, 0.18); color: var(--accent-violet); }

/* accent-cycling for card icon badges: nth-of-type variety */
.pillar-grid .pillar-card:nth-of-type(6n+2) i { background: linear-gradient(135deg, var(--accent-violet), var(--accent-amber), var(--accent-emerald), var(--accent-cyan)); }
.pillar-grid .pillar-card:nth-of-type(6n+3) i { background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet), var(--accent-amber), var(--accent-emerald)); }
.pillar-grid .pillar-card:nth-of-type(6n+4) i { background: linear-gradient(135deg, var(--accent-cyan), var(--accent-emerald), var(--accent-violet), var(--accent-amber)); }
.pillar-grid .pillar-card:nth-of-type(6n+5) i { background: linear-gradient(135deg, var(--accent-emerald), var(--accent-violet), var(--accent-cyan), var(--accent-amber)); }
.pillar-grid .pillar-card:nth-of-type(6n+6) i { background: linear-gradient(135deg, var(--accent-violet), var(--accent-emerald), var(--accent-amber), var(--accent-cyan)); }

.stat-number {
    font-size: 2rem;
    font-weight: 800;
    font-family: 'Space Grotesk', sans-serif;
    background: linear-gradient(120deg, var(--accent-cyan), var(--accent-violet));
    -webkit-background-clip: text;
    background-clip: text;

                <h3>Preventing Plagiarism &amp; Misuse</h3>

                <i class="fas fa-hand"></i>
                <h3>Keeping Teachers In Control</h3>

   AI READINESS CHECKLIST ENGINE (for slide 15)
================================ */
(function initReadinessChecklist() {
    // Wait for slide to render
    const observer = new MutationObserver(function() {
        const container = document.getElementById('checklistContainer');
        if (container && container.children.length === 0) {
            renderChecklist(container);
            setupChecklistListener(container);
            updateCounter();
        }
    });

    observer.observe(document.getElementById('slidesContainer'), { childList: true, subtree: true });

    // Also run on initial load
    setTimeout(function() {
        const container = document.getElementById('checklistContainer');
        if (container && container.children.length === 0) {
            renderChecklist(container);
            setupChecklistListener(container);
            updateCounter();
        }
    }, 100);

    // ----- checklist data (extended for Nigerian schools) -----
    const checklistItems = [
        { label: 'Leadership', desc: 'A named leader is responsible for AI adoption and approval.' },
        { label: 'Purpose', desc: 'The school has identified specific problems AI should help solve.' },
        { label: 'Devices', desc: 'Pilot staff have reliable computers or tablets for approved work.' },
        { label: 'Connectivity', desc: 'Internet access is stable enough for intended tasks.' },
        { label: 'Skills', desc: 'Pilot users understand prompting, checking and privacy basics.' },
        { label: 'Policy', desc: 'There are written rules for staff and student use.' },
        { label: 'Privacy', desc: 'Sensitive data categories and prohibited inputs are understood.' },
        { label: 'Review', desc: 'Every important AI output has a responsible human reviewer.' },
        { label: 'Workflow', desc: 'Approved prompts and review checklists are documented.' },
        { label: 'Measurement', desc: 'The school can track time, quality, adoption and incidents.' },
        { label: 'Stakeholder buy-in', desc: 'Parents, teachers and board are aware and supportive.' },
        { label: 'Digital literacy', desc: 'Staff have baseline digital skills for AI tools.' },
        { label: 'Data governance', desc: 'Clear policies for student data and AI usage.' },
        { label: 'Infrastructure', desc: 'Power and backup are reliable during pilot hours.' },
        { label: 'Continuous PD', desc: 'Plan for ongoing professional development on AI.' }
    ];

    function renderChecklist(container) {
        container.innerHTML = '';
        checklistItems.forEach((item, idx) => {
            const div = document.createElement('div');
            div.className = 'check-item';
            div.innerHTML = `
                <input type="checkbox" id="chk_${idx}" data-index="${idx}">
                <label for="chk_${idx}" style="cursor:pointer;">
                    <strong>${item.label}</strong>
                    <div class="desc">${item.desc}</div>
                </label>
            `;
            container.appendChild(div);
        });
    }

    function setupChecklistListener(container) {
        container.removeEventListener('change', handleChecklistChange);
        container.addEventListener('change', handleChecklistChange);
    }

    function handleChecklistChange(e) {
        if (e.target && e.target.matches('input[type="checkbox"]')) {
            updateCounter();
        }
    }

    function getInterpretation(percent) {
        if (percent >= 91) return 'KUDOS! You are ready for a controlled Copilot.';
        if (percent >= 81) return 'Strong foundation – refine a few areas before pilot.';
        if (percent >= 71) return 'Good progress; address remaining gaps for smoother adoption.';
        if (percent >= 61) return 'Moderate readiness – focus on key missing pillars.';
        if (percent >= 51) return 'Several gaps identified – prioritise foundational elements.';
        if (percent >= 41) return 'Address key gaps first before considering AI.';
        if (percent >= 36) return 'Strengthen foundations before expanding AI use.';
        return 'Preparation is the key. Start small and raise.';
    }

    function updateCounter() {
        const container = document.getElementById('checklistContainer');
        if (!container) return;

        const checkboxes = container.querySelectorAll('input[type="checkbox"]');
        const total = checkboxes.length;
        let checked = 0;
        checkboxes.forEach(cb => { if (cb.checked) checked++; });

        const fraction = total > 0 ? (checked / total) : 0;
        const percent = Math.round(fraction * 100);

        const surveyEl = document.getElementById('survey');
        const percentEl = document.getElementById('percentDisplay');
        const feedbackArea = document.getElementById('feedbackArea');

        if (surveyEl) surveyEl.textContent = `${checked} / ${total}`;
        if (percentEl) percentEl.textContent = percent;

        if (feedbackArea) {
            const customMsg = getInterpretation(percent);
            const base = ' Percentage Feedback:';
            feedbackArea.innerHTML = `<p><strong>Interpretation:</strong> ${base} <br><span style="color:var(--accent-cyan); font-weight:500;">→ ${customMsg}</span></p>`;
        }
    }

    // Expose updateCounter globally so it can be called from other scripts if needed
    window.updateReadinessCounter = updateCounter;
})();

let currentSlideIndex = 0;
let isAnimating = false;
const slideContainer = document.getElementById('slidesContainer');
const navDotsBar = document.getElementById('navDotsBar');
const progressRail = document.getElementById('progressRail');
const counterCurrent = document.getElementById('counterCurrent');
const counterTotal = document.getElementById('counterTotal');
const prevArrow = document.getElementById('prevArrow');
const nextArrow = document.getElementById('nextArrow');
const gestureHint = document.getElementById('gestureHint');

counterTotal.textContent = slidesData.length;

function renderActiveSlide(direction) {
    if (!slideContainer) return;
    const slide = slidesData[currentSlideIndex];
    const slideHtml = `<div class="slide-view entering" id="activeSlideView">${slide.html}</div>`;
    slideContainer.innerHTML = slideHtml;
    updateActiveDot();
    updateProgress();
    updateArrows();
}

function updateActiveDot() {
    const dots = document.querySelectorAll('.nav-dot');
    dots.forEach((dot, idx) => {
        dot.classList.toggle('active', idx === currentSlideIndex);
    });
}

function updateProgress() {
    const pct = ((currentSlideIndex + 1) / slidesData.length) * 100;
    progressRail.style.width = pct + '%';
    counterCurrent.textContent = currentSlideIndex + 1;
}

function updateArrows() {
    prevArrow.classList.toggle('disabled', currentSlideIndex === 0);
    nextArrow.classList.toggle('disabled', currentSlideIndex === slidesData.length - 1);
}

function createNavigationDots() {
    navDotsBar.innerHTML = '';
    slidesData.forEach((_, idx) => {
        const dot = document.createElement('div');
        dot.classList.add('nav-dot');
        if (idx === currentSlideIndex) dot.classList.add('active');
        dot.addEventListener('click', () => {
            if (idx === currentSlideIndex) return;
            currentSlideIndex = idx;
            renderActiveSlide();
        });
        navDotsBar.appendChild(dot);
    });
}

function goToSlide(newIndex, exitClass) {
    if (isAnimating) return;
    if (newIndex < 0 || newIndex > slidesData.length - 1) return;
    const activeView = document.getElementById('activeSlideView');
    isAnimating = true;
    if (activeView) {
        activeView.classList.add(exitClass);
        setTimeout(() => {
            currentSlideIndex = newIndex;
            renderActiveSlide();
            isAnimating = false;
        }, 220);
    } else {
        currentSlideIndex = newIndex;
        renderActiveSlide();
        isAnimating = false;
    }
}

function nextSlide() { goToSlide(currentSlideIndex + 1, 'swipe-out-left'); }
function prevSlide() { goToSlide(currentSlideIndex - 1, 'swipe-out-right'); }
function jumpToClose() { goToSlide(slidesData.length - 1, 'swipe-out-down'); }

prevArrow.addEventListener('click', prevSlide);
nextArrow.addEventListener('click', nextSlide);

/* dark / light mode toggle */
const darkToggle = document.getElementById('darkModeToggle');
function initTheme() {
    const saved = localStorage.getItem('schoolTheme') || 'dark';
    document.body.classList.toggle('light', saved === 'light');
    document.body.classList.toggle('dark', saved !== 'light');
    darkToggle.innerHTML = saved === 'light' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
}
darkToggle.addEventListener('click', () => {
    const goingLight = !document.body.classList.contains('light');
    document.body.classList.toggle('light', goingLight);
    document.body.classList.toggle('dark', !goingLight);
    localStorage.setItem('schoolTheme', goingLight ? 'light' : 'dark');
    darkToggle.innerHTML = goingLight ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
});

/* keyboard navigation */
window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') prevSlide();
    else if (e.key === 'ArrowUp') prevSlide();
    else if (e.key === 'ArrowRight') nextSlide();
    else if (e.key === 'ArrowDown') nextSlide();
    else if (e.key === 'Escape') jumpToClose();
});

/* ===============================
   GESTURE / SWIPE NAVIGATION
   left/right swipe = prev/next slide
   forceful downward swipe = jump to closing slide
================================ */
(function initGestures() {
    const target = document.getElementById('slidesContainer');
    let startX = 0, startY = 0, startTime = 0;
    let tracking = false;

    const THRESH_X = 60;       // px, horizontal swipe distance
    const THRESH_Y_SOFT = 70;  // px, vertical swipe distance
    const THRESH_Y_FORCE = 140; // px, "forceful" downward swipe
    const MAX_TIME = 900;      // ms, must be a swipe not a drag

    function pointerDown(x, y) {
        startX = x; startY = y; startTime = Date.now();
        tracking = true;
    }
    function pointerUp(x, y) {
        if (!tracking) return;
        tracking = false;
        const dx = x - startX;
        const dy = y - startY;
        const dt = Date.now() - startTime;
        if (dt > MAX_TIME) return;

        const absX = Math.abs(dx);
        const absY = Math.abs(dy);

        // forceful downward swipe -> jump to close
        if (dy > THRESH_Y_FORCE && absY > absX) {
            jumpToClose();
            hideHint();
            return;
        }
        // horizontal swipe -> prev/next
        if (absX > THRESH_X && absX > absY) {
            if (dx < 0) nextSlide(); else prevSlide();
            hideHint();
            return;
        }
        // soft vertical swipe up -> next as well (alt gesture)
        if (dy < -THRESH_Y_SOFT && absY > absX) {
            nextSlide();
            hideHint();
        }
    }

    target.addEventListener('touchstart', (e) => {
        const t = e.changedTouches[0];
        pointerDown(t.clientX, t.clientY);
    }, { passive: true });

    target.addEventListener('touchend', (e) => {
        const t = e.changedTouches[0];
        pointerUp(t.clientX, t.clientY);
    }, { passive: true });

    // mouse drag support for desktop trackpads/mice
    let mouseDown = false;
    target.addEventListener('mousedown', (e) => {
        mouseDown = true;
        pointerDown(e.clientX, e.clientY);
    });
    window.addEventListener('mouseup', (e) => {
        if (!mouseDown) return;
        mouseDown = false;
        pointerUp(e.clientX, e.clientY);
    });

    function hideHint() {
        if (gestureHint) gestureHint.classList.add('fade');
    }
    setTimeout(hideHint, 5000);
})();

/* responsive init */
function init() {
    createNavigationDots();
    renderActiveSlide();
    initTheme();
}
init();
</script>

<script>
/* ===============================
   HAMBURGER MENU TOGGLE
   (preserved from finAI_.html)
================================ */
const hamburger = document.getElementById('hamburger-menu');
const mainNav = document.getElementById('main-nav');

if (hamburger && mainNav) {
    hamburger.addEventListener('click', function (e) {
        e.stopPropagation();
        this.classList.toggle('active');
        mainNav.classList.toggle('open');
    });
    mainNav.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
            hamburger.classList.remove('active');
            mainNav.classList.remove('open');
        });
    });
    document.addEventListener('click', function (e) {
        if (!hamburger.contains(e.target) && !mainNav.contains(e.target)) {
            hamburger.classList.remove('active');
            mainNav.classList.remove('open');
        }
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
            hamburger.classList.remove('active');
            mainNav.classList.remove('open');
        }
    });
}

<script>
/* =======================================================================
BACKGROUND ANIMATION SCRIPT
(preserved verbatim from finAI_.html — Deep Space Simulation engine)
==========================================================================
/**
 * Deep Space Simulation
 * A highly performant, visually stunning space background
 * featuring blinking stars, shooting stars with multilingual
 * character rain, floating planets, and galactic orbital lines.
 */

// ──────────────────────────────────────
// MULTILINGUAL CHARACTER SET
// ──────────────────────────────────────

    (() => {
      const canvas = document.getElementById('space');
      const ctx = canvas.getContext('2d', { alpha: false });

      const DPR = Math.min(window.devicePixelRatio || 1, 2);

      let width = window.innerWidth;
      let height = window.innerHeight;
      let centerX = width * 0.5;
      let centerY = height * 0.5;

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        centerX = width * 0.5;
        centerY = height * 0.5;

        canvas.width = width * DPR;
        canvas.height = height * DPR;

        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';

        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      }

      resize();
      window.addEventListener('resize', resize);

      const SPEED = 0.5;
      const STAR_COUNT = 1500;
      const BRIGHT_STAR_COUNT = 20;
      const ASTEROID_COUNT = 40;

      const stars = [];
      const brightStars = [];
      const asteroids = [];
      const shootingStars = [];
      const nebulae = [];
      const matrixParticles = [];
      const planets = [];

      const characters = '01アカサタナｦｧｨｩｪｫｬｭｮｯｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789ABCDEF';

      function rand(min, max) {
        return Math.random() * (max - min) + min;
      }

      function perspective(x, y, z) {
        const scale = 600 / z;

        return {
          x: x * scale + centerX,
          y: y * scale + centerY,
          scale
        };
      }

      class Star {
        constructor(bright = false) {
          this.bright = bright;
          this.reset();
        }

        reset() {
          this.x = rand(-2200, 2200);
          this.y = rand(-2200, 2200);
          this.z = rand(200, 2000);
          this.baseSize = this.bright ? rand(2, 7) : rand(0.3, 1.4);
          this.twinkle = rand(0, Math.PI * 2);
          this.speed = this.bright ? SPEED * 1.4 : SPEED;
        }

        update() {
          this.z -= this.speed;

          if (this.z <= 1) {
            this.reset();
            this.z = 2000;
          }
        }

        draw() {
          const p = perspective(this.x, this.y, this.z);

          if (
            p.x < -100 ||
            p.x > width + 100 ||
            p.y < -100 ||
            p.y > height + 100
          ) {
            return;
          }

          const pulse = 0.5 + Math.sin(performance.now() * 0.002 + this.twinkle) * 0.5;
          const radius = this.baseSize * p.scale * 1.2;

          if (this.bright) {
            ctx.save();
            ctx.globalCompositeOperation = 'screen';

            const glow = ctx.createRadialGradient(
              p.x,
              p.y,
              0,
              p.x,
              p.y,
              radius * 12
            );

            glow.addColorStop(0, `rgba(255,255,255,${0.9 * pulse})`);
            glow.addColorStop(0.2, `rgba(120,220,255,${0.4 * pulse})`);
            glow.addColorStop(0.4, `rgba(120,220,255,${0.2 * pulse})`);
            glow.addColorStop(1, 'rgba(0,0,0,0)');

            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(p.x, p.y, radius * 12, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = `rgba(255,255,255,${0.7 * pulse})`;
            ctx.lineWidth = radius * 0.6;

            ctx.beginPath();
            ctx.moveTo(p.x - radius * 10, p.y);
            ctx.lineTo(p.x + radius * 10, p.y);
            ctx.moveTo(p.x, p.y - radius * 10);
            ctx.lineTo(p.x, p.y + radius * 10);
            ctx.stroke();

            ctx.restore();
          }

          ctx.fillStyle = this.bright
            ? `rgba(255,255,255,${pulse})`
            : `rgba(255,255,255,${0.45 + pulse * 0.45})`;

          ctx.beginPath();
          ctx.arc(p.x, p.y, Math.max(radius, 0.4), 0, Math.PI * 2);
          ctx.fill();
        }
      }

      class Asteroid {
        constructor() {
          this.reset();
        }

        reset() {
          this.x = rand(-1800, 1800);
          this.y = rand(-1000, 1000);
          this.z = rand(300, 2200);
          this.radius = rand(10, 45);
          this.rotation = rand(0, Math.PI * 2);
          this.rotationSpeed = rand(-0.02, 0.02);
          this.vertices = [];

          const count = Math.floor(rand(5, 9));

          for (let i = 0; i < count; i++) {
            this.vertices.push({
              angle: (Math.PI * 2 * i) / count,
              offset: rand(0.7, 1.35)
            });
          }
        }

        update() {
          this.z -= SPEED * 1.6;
          this.rotation += this.rotationSpeed;

          if (this.z <= 1) {
            this.reset();
            this.z = 2400;
          }
        }

        draw() {
          const p = perspective(this.x, this.y, this.z);
          const r = this.radius * p.scale;

          if (r < 0.4) return;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(this.rotation);

          ctx.beginPath();

          this.vertices.forEach((v, i) => {
            const px = Math.cos(v.angle) * r * v.offset;
            const py = Math.sin(v.angle) * r * v.offset;

            if (i === 0) {
              ctx.moveTo(px, py);
            } else {
              ctx.lineTo(px, py);
            }
          });

          ctx.closePath();

          const gradient = ctx.createLinearGradient(-r, -r, r, r);
          gradient.addColorStop(0, '#8a8a8a');
          gradient.addColorStop(0.5, '#3d3d3d');
          gradient.addColorStop(1, '#171717');

          ctx.fillStyle = gradient;
          ctx.fill();

          ctx.strokeStyle = 'rgba(255,255,255,0.08)';
          ctx.stroke();

          ctx.restore();
        }
      }

      class ShootingStar {
        constructor() {
          this.reset(true);
        }

        reset(initial = false) {
          this.x = rand(width * 0.2, width * 0.9);
          this.y = rand(-100, height * 0.4);
          this.length = rand(180, 420);
          this.speed = rand(40, 70);
          this.angle = rand(-0.4, -0.9);
          this.life = rand(40, 90);
          this.opacity = 1;

          if (!initial) {
            for (let i = 0; i < 28; i++) {
              matrixParticles.push(new MatrixParticle(this.x, this.y));
            }
          }
        }

        update() {
          this.x += Math.cos(this.angle) * this.speed;
          this.y += Math.sin(this.angle) * this.speed;
          this.life--;
          this.opacity *= 0.97;

          if (this.life <= 0) {
            this.reset();
          }
        }

        draw() {
          ctx.save();
          ctx.globalCompositeOperation = 'screen';

          const tailX = this.x - Math.cos(this.angle) * this.length;
          const tailY = this.y - Math.sin(this.angle) * this.length;

          const grad = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
          grad.addColorStop(0, `rgba(255,255,255,${this.opacity})`);
          grad.addColorStop(0.2, `rgba(120,220,255,${this.opacity * 0.8})`);
          grad.addColorStop(1, 'rgba(0,0,0,0)');

          ctx.strokeStyle = grad;
          ctx.lineWidth = 3;

          ctx.beginPath();
          ctx.moveTo(this.x, this.y);
          ctx.lineTo(tailX, tailY);
          ctx.stroke();

          ctx.restore();
        }
      }

      class MatrixParticle {
        constructor(x, y) {
          this.x = x;
          this.y = y;
          this.vx = rand(-6, 6);
          this.vy = rand(-6, 6);
          this.life = rand(30, 90);
          this.char = characters[Math.floor(rand(0, characters.length))];
          this.size = rand(10, 18);
          this.opacity = 1;
        }

        update(index) {
          this.x += this.vx;
          this.y += this.vy;
          this.vx *= 0.985;
          this.vy *= 0.985;
          this.life--;
          this.opacity *= 0.97;

          if (this.life <= 0) {
            matrixParticles.splice(index, 1);
          }
        }

        draw() {
          ctx.save();
          ctx.globalCompositeOperation = 'screen';
          ctx.fillStyle = `rgba(0,255,180,${this.opacity})`;
          ctx.font = `${this.size}px monospace`;
          ctx.fillText(this.char, this.x, this.y);
          ctx.restore();
        }
      }

      class Nebula {
        constructor() {
          this.reset();
        }

        reset() {
          this.x = rand(-width * 0.5, width);
          this.y = rand(-height * 0.5, height);
          this.radius = rand(300, 1000);
          this.hue = rand(180, 320);
          this.opacity = rand(0.02, 0.05);
          this.drift = rand(0.05, 0.3);
        }

        update() {
          this.x += this.drift;

          if (this.x > width + this.radius) {
            this.x = -this.radius;
          }
        }

        draw() {
          ctx.save();
          ctx.globalCompositeOperation = 'screen';

          const gradient = ctx.createRadialGradient(
            this.x,
            this.y,
            0,
            this.x,
            this.y,
            this.radius
          );

          gradient.addColorStop(0, `hsla(${this.hue},100%,70%,${this.opacity})`);
          gradient.addColorStop(0.3, `hsla(${this.hue + 40},100%,60%,${this.opacity * 0.8})`);
          gradient.addColorStop(1, 'rgba(0,0,0,0)');

          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        }
      }

      class Planet {
        constructor(data, index) {
          this.name = data.name;
          this.color = data.color;
          this.radius = data.radius;
          this.type = data.type;
          this.rings = data.rings;
          this.index = index;

          this.x = data.x;
          this.y = data.y;
          this.z = 8000 + index * 2200;
        }

        update() {
          const localSpeed = this.name === 'Jupiter' ? SPEED * 0.5 : SPEED;
          this.z -= localSpeed;
        }

        drawPlanetTexture(px, py, pr) {
          const gradient = ctx.createRadialGradient(
            px - pr * 0.3,
            py - pr * 0.3,
            pr * 0.2,
            px,
            py,
            pr
          );

          switch (this.name) {
            case 'Mercury':
              gradient.addColorStop(0, '#d2d2d2');
              gradient.addColorStop(1, '#575757');
              break;

            case 'Venus':
              gradient.addColorStop(0, '#ffe59f');
              gradient.addColorStop(1, '#bc8d23');
              break;

            case 'Earth':
              gradient.addColorStop(0, '#79d4ff');
              gradient.addColorStop(0.5, '#1b63ff');
              gradient.addColorStop(1, '#0036a3');
              break;

            case 'Mars':
              gradient.addColorStop(0, '#ffb37d');
              gradient.addColorStop(1, '#8d2d08');
              break;

            case 'Jupiter':
              gradient.addColorStop(0, '#f8dfb0');
              gradient.addColorStop(1, '#ad6930');
              break;

            case 'Saturn':
              gradient.addColorStop(0, '#fff0bf');
              gradient.addColorStop(1, '#af8a40');
              break;

            case 'Uranus':
              gradient.addColorStop(0, '#dffcff');
              gradient.addColorStop(1, '#8fd6e5');
              break;

            case 'Neptune':
              gradient.addColorStop(0, '#7bb6ff');
              gradient.addColorStop(1, '#001c7f');
              break;

            case 'Pluto':
              gradient.addColorStop(0, '#d4d4d4');
              gradient.addColorStop(1, '#7d7d7d');
              break;
          }

          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(px, py, pr, 0, Math.PI * 2);
          ctx.fill();

          if (this.name === 'Earth') {
            ctx.save();
            ctx.shadowBlur = pr * 0.7;
            ctx.shadowColor = 'rgba(100,180,255,0.9)';
            ctx.strokeStyle = 'rgba(120,220,255,0.4)';
            ctx.lineWidth = pr * 0.05;
            ctx.beginPath();
            ctx.arc(px, py, pr * 1.03, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          }

          if (this.name === 'Jupiter') {
            ctx.save();
            ctx.strokeStyle = 'rgba(255,255,255,0.15)';

            for (let i = -3; i <= 3; i++) {
              ctx.beginPath();
              ctx.moveTo(px - pr * 0.9, py + i * pr * 0.18);
              ctx.lineTo(px + pr * 0.9, py + i * pr * 0.18);
              ctx.stroke();
            }

            ctx.restore();
          }
        }

        draw() {
          if (this.z <= 1) return;

          const p = perspective(this.x, this.y, this.z);
          const pr = this.radius * p.scale;

          if (pr < 1) return;

          ctx.save();

          if (this.rings) {
            ctx.strokeStyle = 'rgba(255,230,180,0.7)';
            ctx.lineWidth = pr * 0.08;

            ctx.beginPath();
            ctx.ellipse(
              p.x,
              p.y,
              pr * 1.9,
              pr * 0.5,
              -0.5,
              0,
              Math.PI * 2
            );
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(
              p.x,
              p.y,
              pr * 2.3,
              pr * 0.65,
              -0.5,
              0,
              Math.PI * 2
            );
            ctx.stroke();
          }

          this.drawPlanetTexture(p.x, p.y, pr);

          ctx.fillStyle = 'rgba(255,255,255,0.7)';
          ctx.font = `${Math.max(pr * 0.18, 11)}px sans-serif`;
          ctx.fillText(this.name, p.x + pr * 1.4, p.y - pr * 1.2);

          ctx.restore();
        }
      }

      const planetData = [
        {
          name: 'Mercury',
          radius: 17,
          x: -180,
          y: -90
        },
        {
          name: 'Venus',
          radius: 42,
          x: -1900,
          y: -1140
        },
        {
          name: 'Earth',
          radius: 45,
          x: -200,
          y: 80
        },
        {
          name: 'Mars',
          radius: 24,
          x: 250,
          y: 1920
        },
        {
          name: 'Jupiter',
          radius: 500,
          x: -900,
          y: -60
        },
        {
          name: 'Saturn',
          radius: 421,
          x: 950,
          y: 940,
          rings: true
        },
        {
          name: 'Uranus',
          radius: 179,
          x: -280,
          y: 1040,
        },
        {
          name: 'Neptune',
          radius: 173,
          x: 2080,
          y: -1020
        },
        {
          name: 'Pluto',
          radius: 9,
          x: 520,
          y: 250
        }
      ];

      for (let i = 0; i < STAR_COUNT; i++) {
        stars.push(new Star(false));
      }

      for (let i = 0; i < BRIGHT_STAR_COUNT; i++) {
        brightStars.push(new Star(true));
      }

      for (let i = 0; i < ASTEROID_COUNT; i++) {
        asteroids.push(new Asteroid());
      }

      for (let i = 0; i < 3; i++) {
        shootingStars.push(new ShootingStar());
      }

      for (let i = 0; i < 5; i++) {
        nebulae.push(new Nebula());
      }

      planetData.forEach((p, i) => {
        planets.push(new Planet(p, i));
      });

      let lastNebulaShift = 0;

      function drawCockpitOverlay() {
        ctx.save();

        ctx.strokeStyle = 'rgba(120,220,255,0.08)';
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(0, height);
        ctx.lineTo(width * 0.2, height * 0.72);
        ctx.moveTo(width, height);
        ctx.lineTo(width * 0.8, height * 0.72);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(centerX, centerY, 30, 0, Math.PI * 2);
        ctx.stroke();

        ctx.restore();
      }

      function animate(time) {
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.fillRect(0, 0, width, height);

        if (time - lastNebulaShift > 12000) {
          nebulae.push(new Nebula());
          lastNebulaShift = time;

          if (nebulae.length > 7) {
            nebulae.shift();
          }
        }

        nebulae.forEach(n => {
          n.update();
          n.draw();
        });

        stars.forEach(star => {
          star.update();
          star.draw();
        });

        brightStars.forEach(star => {
          star.update();
          star.draw();
        });

        asteroids.forEach(asteroid => {
          asteroid.update();
          asteroid.draw();
        });

        planets.forEach(planet => {
          planet.update();
          planet.draw();
        });

        shootingStars.forEach(star => {
          star.update();
          star.draw();
        });

        for (let i = matrixParticles.length - 1; i >= 0; i--) {
          matrixParticles[i].update(i);
          matrixParticles[i]?.draw();
        }

        drawCockpitOverlay();

        requestAnimationFrame(animate);
      }

      requestAnimationFrame(animate);
    })();
</script>

// ──────────────────────────────────────
// SLIDE 2 HIDDEN DETAIL ENGINE
// ──────────────────────────────────────
function toggleAccordion(elementId) {
  const currentItem = document.getElementById(elementId);
  const currentTrigger = currentItem.querySelector('.accordion-trigger');
  const isActive = currentItem.classList.contains('active');
  
  // Optional: Close all other accordion items (Single-accordion mode)
  const allItems = document.querySelectorAll('.accordion-item');
  allItems.forEach(item => {
    item.classList.remove('active');
    const trigger = item.querySelector('.accordion-trigger');
    if (trigger) trigger.setAttribute('aria-expanded', 'false');
  });

  // Toggle state of clicked item
  if (!isActive) {
    currentItem.classList.add('active');
    currentTrigger.setAttribute('aria-expanded', 'true');
  }
}
</script>
